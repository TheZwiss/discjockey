# A signed draft release for a v* tag: the same checks as check.yml, then the signed .dmg attached to a draft release.
# Nothing here publishes: the maintainer reads the draft and publishes it by hand. A release always comes from a tag
# (no manual trigger), and a published release is never touched.
# Actions are pinned by commit SHA (version in the comment): this job holds the signing key, and a moved tag must not
# run new code with it. Secrets only ever reach a step through `env:`.
# The checking steps (public check, uv, tools, Python tests, node) repeat those of check.yml on purpose
# (tests/test_workflows.py pins both copies). Change one, change the other.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'TheZwiss/discjockey'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false  # no token left in .git/config while third-party code runs

      # Before anything else: the tag must name the version the code says it is.
      - name: Version gate
        id: gate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' discjockey/__init__.py)"
          if [ -z "$version" ] || [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Twin of the "Public check" step in check.yml. A release without the full check (the denylist included) is refused.
      - name: Public check
        env:
          PUBLIC_CHECK_DENYLIST: ${{ secrets.PUBLIC_CHECK_DENYLIST }}
        run: |
          if [ -z "$PUBLIC_CHECK_DENYLIST" ]; then
            echo "::error::the PUBLIC_CHECK_DENYLIST secret is empty or missing; a release needs the full check"
            exit 1
          fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/denylist.txt"' EXIT  # the denylist is not kept for the later steps
          printf '%s\n' "$PUBLIC_CHECK_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          DISCJOCKEY_PUBLIC_DENYLIST="$RUNNER_TEMP/denylist.txt" scripts/check_public.sh --require-denylist

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.28"

      - run: uv sync --frozen

      - name: Cache the pinned tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: dist/cache
          key: tools-${{ runner.os }}-${{ hashFiles('packaging/tools.json', 'packaging/build_ffmpeg.sh', 'packaging/fetch_tools.py') }}

      # --fresh-build: this job signs what it ships, and a cached ffmpeg build can't be checked against any hash (the
      # build isn't reproducible). A tag run restores caches that check.yml saved on main after running third-party
      # code (uv sync, npm ci), so the release builds its own ffmpeg (a few minutes) and trusts only the cached
      # downloads, which are re-hashed against tools.json on every use.
      - name: Fetch the pinned tools
        run: |
          uv run --frozen python packaging/fetch_tools.py --out dist/tools --cache dist/cache --fresh-build
          echo "$GITHUB_WORKSPACE/dist/tools/bin" >> "$GITHUB_PATH"

      - name: Python tests
        run: uv run --frozen pytest -q

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: hub-ui/package-lock.json

      # Twin of the "hub-ui check" step in check.yml. `npm run build` is not a step of its own: build_app.sh builds hub-ui into dist/ui and fails unless that equals
      # the committed discjockey/hub/static (building into the tree would dirty the checkout REQUIRE_IDENTITY insists on).
      - name: hub-ui check
        working-directory: hub-ui
        run: |
          npm ci
          npx playwright install webkit
          npm run verify

      - name: Import the signing identity
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.p12"' EXIT  # the keychain holds the key now; the file is not kept
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          DISCJOCKEY_SIGNING_DIR="$RUNNER_TEMP/signing" scripts/import_signing_identity.sh "$RUNNER_TEMP/release.p12"

      - name: Build the signed app and .dmg
        run: |
          UV="$(command -v uv)"
          export UV
          export DISCJOCKEY_SIGNING_DIR="$RUNNER_TEMP/signing"
          REQUIRE_IDENTITY=1 scripts/build_app.sh

      # Draft only. A re-run replaces the .dmg and the FFmpeg source of the draft; a published release is never replaced.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          dmg="dist/Discjockey-$VERSION.dmg"
          test -f "$dmg"
          # The FFmpeg source this ffmpeg was built from (GPL-3.0 section 6: the source stays available with the
          # release, whatever ffmpeg.org does later). It is the hash-checked download in the cache; its version and
          # hash come from tools.json, so they are written down once.
          ffmpeg_version="$(jq -r .ffmpeg.version packaging/tools.json)"
          ffmpeg_sha="$(jq -r .ffmpeg.sha256 packaging/tools.json)"
          ffmpeg_source="dist/ffmpeg-$ffmpeg_version.tar.xz"
          cp "dist/cache/$ffmpeg_sha.tar.xz" "$ffmpeg_source"
          echo "$ffmpeg_sha  $ffmpeg_source" | shasum -a 256 -c -
          states="$(gh release list --limit 1000 --json tagName,isDraft --jq '.[] | [.tagName, (.isDraft | tostring)] | @tsv' \
            | awk -F'\t' -v tag="$TAG" '$1 == tag { print $2 }')"
          if printf '%s\n' "$states" | grep -qx false; then
            echo "::error::release $TAG is already published; not replacing its .dmg"
            exit 1
          elif printf '%s\n' "$states" | grep -qx true; then
            gh release upload "$TAG" "$dmg" "$ffmpeg_source" --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "Discjockey $VERSION" --generate-notes "$dmg" "$ffmpeg_source"
          fi

      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing/discjockey-release.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/denylist.txt"
