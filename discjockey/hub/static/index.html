<title>Discjockey</title>
<style>
  html, body { background: #000; }
  /* where a dropped file lands (pywebview's drop handler, app.register_drop): hit only while a file is dragged */
  #drop-catcher { position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; }
  #drop-catcher.on { pointer-events: auto; }
</style>
<script>
  // Keeps WebKit from opening a dropped file in the window; Discjockey reads it through pywebview instead.
  // Events that arrive before the app has booted wait in window.dj.queue.
  for (const t of ["dragover", "drop"]) document.addEventListener(t, (e) => e.preventDefault());
  window.dj = { queue: [], onEvent(event) { this.queue.push(event); } };
</script>
