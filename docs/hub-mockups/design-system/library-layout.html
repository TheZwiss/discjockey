<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library layout – design system</title>
<!-- The design note, the tables, the states and the reasons are in library-layout-notes.md next to this file.
     This page is only the app window and the state switcher, so it can be tried by hand. -->
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #111; color: #9a9aa0; font: 13px -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  .bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; }
  .bar h2 { margin: 0; color: #f2f2f4; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pick { display: inline-flex; flex-wrap: wrap; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
  .pick button { background: none; border: 0; border-left: 1px solid #333; color: #9a9aa0; font: 12px -apple-system; padding: 6px 10px; cursor: pointer; }
  .pick button:first-child { border-left: 0; }
  .pick button:hover { color: #dcdce0; }
  .pick button.on { background: rgba(255,90,31,.16); color: #ff8a5a; }
  .pick button:active { transform: scale(.96); }
  .pick .sep { width: 1px; background: #555; }
  .bar .notes { margin-left: auto; color: #9a9aa0; font-size: 12px; text-decoration: none; white-space: nowrap; }
  .bar .notes:hover { color: #dcdce0; }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px 16px; }
  .sizer { flex: none; position: relative; }
  body.resizing, body.resizing * { cursor: col-resize !important; }

  /* ---- look 2 tokens (docs/hub-design-language.md, tokens.css), as library-browser.html ---- */
  .win { --bg: #000; --sb-bg: linear-gradient(#0b0b0d, #070708); --sb-solid: #09090b; --sb-line: rgba(255,255,255,.06); --panel-bg: #040405; --text: #dcdce0; --text-strong: #f4f4f6; --muted: #9a9aa2; --label: #5c5c64; --nav: #7c7c84;
    --accent: #ff5a1f; --accent-text: #ff8a5a; --accent-wash: rgba(255,90,31,.14); --accent-wash-strong: rgba(255,90,31,.22); --ctl-line: rgba(255,255,255,.09); --ctl-bg: rgba(255,255,255,.03); --hover: rgba(255,255,255,.035); --ctl-hover: rgba(255,255,255,.05);
    --list-bg: linear-gradient(#0c0c0e, #08080a); --list-solid: #0b0b0d; --list-line: rgba(255,255,255,.06); --row-line: rgba(255,255,255,.045);
    --card-bg: linear-gradient(#0f0f12, #0a0a0c); --card-line: rgba(255,255,255,.07); --card-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 1px 2px rgba(0,0,0,.6);
    --good: #2fd27a; --ok: #e8b93a; --weak: #f0524a; --lossy: #a77bff; --missing: #c0504a; --wait: #e8b93a; --nav-on: rgba(255,255,255,.07); --pop-bg: #1b1b1f;
    position: absolute; left: 0; top: 0; transform-origin: 0 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; background: var(--sb-bg); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); cursor: default; user-select: none; -webkit-user-select: none; }
  .win * { box-sizing: border-box; }
  .win input { all: unset; flex: 1; min-width: 0; color: var(--text-strong); font-size: 12px; cursor: text; -webkit-user-select: text; user-select: text; }
  .win input::placeholder { color: var(--label); }
  .body { flex: 1; min-height: 0; display: flex; }
  /* the page sits inside the L frame on black; only its edges have a line (left, and the bottom while the foot shows) */
  .inner { flex: 1; min-width: 0; display: flex; background: var(--bg); border-left: 1px solid var(--sb-line); position: relative; }
  .has-foot .inner { border-bottom: 1px solid var(--sb-line); }

  /* ---- the app sidebar, full (168) and rail (50): one markup, the rail hides the labels; the glyph column (18–32 px) and every row's y stay put ---- */
  .sb { width: 168px; flex: none; padding: 16px 10px 14px; display: flex; flex-direction: column; gap: 2px; min-height: 0; position: relative; }
  .sb.rail { width: 50px; }
  .sb.beside { border-right: 1px solid var(--sb-line); }
  .shead { display: flex; align-items: center; height: 22px; margin: 0 0 8px; flex: none; }
  .tog { width: 30px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center; color: var(--label); }
  .tog:hover { background: var(--ctl-hover); color: var(--text); }
  .brand { color: #9a9aa0; font-weight: 700; padding-left: 1px; white-space: nowrap; }
  .rail .brand { display: none; }
  .nav { display: flex; align-items: center; height: 30px; flex: none; padding: 0 8px; border-radius: 7px; color: var(--nav); white-space: nowrap; min-width: 0; position: relative; }
  .nav:hover { background: var(--ctl-bg); color: var(--text); }
  .nav.on { color: var(--text-strong); background: var(--nav-on); }
  .rail .nav { width: 30px; }
  .rail .nav .t, .rail .nav .c { display: none; }
  .nav.kb { background: var(--accent-wash); color: var(--text-strong); }
  .nav.menu-on { box-shadow: inset 0 0 0 1px rgba(255,138,90,.55); color: var(--text); }
  .g { width: 14px; height: 14px; flex: none; display: grid; place-items: center; font-size: 12px; margin-right: 9px; position: relative; }
  .rail .g { margin-right: 0; }
  .g .gl, .g > svg { opacity: .8; }
  .nav.on .g > svg, .nav.on .g .gl { opacity: 1; }
  .warn { position: absolute; top: -1px; right: -4px; width: 6px; height: 6px; border-radius: 50%; background: var(--wait); }
  /* the rail's To-do count: a neutral pill on the glyph's corner (the count, not an alarm) */
  .bdg { position: absolute; left: 11px; top: -9px; min-width: 18px; height: 14px; padding: 0 4px; border-radius: 7px; background: #2a2a30; box-shadow: 0 0 0 2px #0a0a0b; color: var(--text); font: 600 11px/14px -apple-system; text-align: center; font-variant-numeric: tabular-nums; }
  /* a running sync: a neutral ring round ⟳, its arc = the share done */
  .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); overflow: visible; }
  .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* a crate's place in its name ("Hardtechno › 2019", "Bounce · Old Sets"): the words keep the row's colour, only the
     separator is quiet, so no part of a name ever looks dimmed (dimmed = a switched-off playlist, nothing else) */
  .sepc { color: var(--label); }
  .t .hl { color: var(--text-strong); font-weight: 600; }
  .c { flex: none; min-width: var(--count-w, 14px); margin-left: 4px; text-align: right; font-size: 11px; color: var(--label); font-variant-numeric: tabular-nums; }
  .nav.on .c, .nav.kb .c { color: var(--muted); }
  .chev { flex: none; width: 10px; height: 22px; margin-left: 2px; display: grid; place-items: center; border-radius: 5px; color: var(--label); }
  .chev svg { transition: transform 160ms cubic-bezier(.23,1,.32,1); }
  .chev.open svg { transform: rotate(90deg); }
  .nav.on .chev { color: var(--muted); }
  .crate { padding-left: 31px; }
  .mark { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(232,185,58,.7); background: rgba(232,185,58,.14); color: var(--wait); font: 700 9px/11px -apple-system; text-align: center; }
  .off { opacity: .5; }
  .grp { margin: 12px 7px 4px; font-size: 11px; letter-spacing: .7px; text-transform: uppercase; color: var(--label); flex: none; }
  .favs { display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; }
  .settings { margin-top: auto; }
  .spacer { flex: 1; }
  /* the hidden player in the rail: ⌃ Show player above a play button whose ring is the position */
  .np { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 30px; flex: none; margin-top: auto; }
  .np .up { width: 30px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: var(--label); }
  .np .pb { width: 30px; height: 30px; display: grid; place-items: center; position: relative; color: var(--text-strong); }
  .rail .np + .settings { margin-top: 2px; }
  .nprow { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 4px; margin-top: auto; flex: none; }

  /* ---- the browser column: chrome, as wide as the user drags it (200–360, 240 by default) ---- */
  .browser { width: var(--bw, 240px); flex: none; display: flex; flex-direction: column; min-height: 0; padding: 23px 8px 10px; position: relative; }
  .bfind { flex: none; height: 28px; margin: 0 0 6px; border-radius: 7px; border: 1px solid var(--ctl-line); background: var(--ctl-bg); display: flex; align-items: center; gap: 7px; padding: 0 5px 0 8px; color: var(--label); font-size: 12px; }
  .bfind .ico { color: var(--muted); display: grid; }
  .bfind kbd, .search kbd { font: 11px -apple-system; border: 1px solid var(--ctl-line); border-radius: 4px; padding: 0 4px; color: var(--muted); flex: none; }
  .bfind:focus-within, .search:focus-within { border-color: rgba(255,138,90,.45); box-shadow: 0 0 0 3px rgba(255,90,31,.12); }
  .bfind input { caret-color: var(--accent-text); }
  .x { width: 18px; height: 18px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: rgba(255,255,255,.07); font-size: 10px; }
  .x:hover { background: rgba(255,255,255,.12); color: var(--text); }
  /* a section head: sticky at the list's top and foot. Solid in the column's own colour and square, so a row never
     shows through or round its corners; while it stands over rows (stuck) a hairline marks the edge */
  .sh { position: sticky; top: 0; bottom: 0; z-index: 2; background: var(--sb-solid); display: flex; align-items: center; height: 28px; flex: none; padding: 0 3px 0 8px; margin-top: 4px; color: var(--label); font-size: 12px; font-weight: 600; }
  .sh:hover { color: var(--muted); }
  .sh.stuck-t { box-shadow: 0 1px 0 var(--sb-line); }
  .sh.stuck-b { box-shadow: 0 -1px 0 var(--sb-line); }
  .sh .n { font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; flex: 1; }
  .sh .sp { flex: 1; }
  .sh .ibtn, .sh .chev { width: 20px; height: 20px; margin: 0; }
  .ibtn { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--label); }
  .ibtn:hover { background: var(--ctl-hover); color: var(--text); }
  .ibtn.on { color: var(--muted); }
  .lib { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; position: relative; }
  .lib::-webkit-scrollbar { display: none; }
  .gap { height: 6px; flex: none; }
  .hintrow { height: 30px; flex: none; display: flex; align-items: center; padding: 0 8px; border: 1px dashed rgba(255,255,255,.1); border-radius: 7px; color: var(--label); font-size: 12px; white-space: nowrap; overflow: hidden; }
  /* the hand-off to the track search: the filter's last row while filtering, the only row when no name matches */
  .handoff .g { color: var(--muted); }
  .handoff .c { visibility: hidden; font-size: 12px; }
  .handoff.kb .c { visibility: visible; }
  .slot { height: 30px; flex: none; }
  .lift { position: absolute; left: 0; right: 0; z-index: 3; background: #1d1d22; color: var(--text-strong); box-shadow: 0 4px 10px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.1); transform: translate(3px, -2px) scale(1.02); }
  /* the column's right edge is the page's edge line; a 9 px grip sits on it */
  .edge { position: absolute; top: 0; bottom: 0; right: -5px; width: 9px; z-index: 6; cursor: col-resize; }
  .edge.drag::after { content: ''; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; background: var(--accent); }
  .cursor { position: absolute; z-index: 9; pointer-events: none; }

  .cmenu { position: absolute; z-index: 8; min-width: 236px; padding: 5px; border-radius: 9px; background: var(--pop-bg); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 14px 40px rgba(0,0,0,.7); font-size: 13px; }
  .cmenu div { display: flex; align-items: center; gap: 12px; height: 26px; padding: 0 9px; border-radius: 5px; color: var(--text); white-space: nowrap; }
  .cmenu div.hov, .cmenu div:hover { background: var(--accent); color: #fff; }
  .cmenu div span { margin-left: auto; color: var(--label); font-size: 12px; }
  .cmenu div.hov span, .cmenu div:hover span { color: rgba(255,255,255,.75); }
  .cmenu hr { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 4px 6px; }
  .tip { position: absolute; z-index: 8; padding: 5px 8px; border-radius: 6px; background: #26262b; border: 1px solid rgba(255,255,255,.1); color: var(--text); font-size: 11px; line-height: 1.45; box-shadow: 0 6px 18px rgba(0,0,0,.6); white-space: nowrap; }
  .tip .lb { color: var(--muted); } .tip kbd { font: 11px -apple-system; color: var(--muted); margin-left: 10px; }

  /* ---- the page ---- */
  .main { flex: 1; min-width: 0; overflow: hidden; display: flex; justify-content: center; }
  .col { width: 100%; max-width: var(--max, 1244px); height: 100%; padding: 20px 22px 0; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .col > * { flex: none; }
  .hd { display: flex; align-items: center; gap: 10px; min-height: 34px; min-width: 0; }
  .hd h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--text-strong); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  /* the subtitle's parts drop whole, the last (least important) first: they wrap onto a second line that's clipped */
  .hd .st { color: var(--muted); font-size: 12px; line-height: 16px; height: 16px; margin-top: 5px; display: flex; flex-wrap: wrap; overflow: hidden; min-width: 0; flex: 1 1 0; }
  .hd .st > span { white-space: pre; }
  .hd .st > span:first-child { width: 0; height: 16px; flex: none; }   /* an empty first item, a line tall: even the first part wraps away rather than be cut */
  .search { margin-left: auto; flex: none; width: 240px; height: 34px; border-radius: 8px; border: 1px solid var(--ctl-line); background: var(--ctl-bg); color: var(--label); font-size: 12px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; }
  .search > svg { color: var(--muted); flex: none; }
  /* the details toggle: a header control (34 px, the row's height); pressed = accent text on the strong wash plus a dot */
  .itog { flex: none; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--ctl-line); background: var(--ctl-bg); display: grid; place-items: center; color: var(--muted); position: relative; }
  .itog:hover { color: var(--text); background: var(--ctl-hover); }
  .itog:active, .pbtn:active, .go:active { transform: scale(.97); }
  .itog.pressed { color: var(--accent-text); background: var(--accent-wash-strong); border-color: rgba(255,138,90,.35); }
  .itog.pressed::after { content: ''; position: absolute; bottom: 4px; left: 50%; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--accent-text); }
  .seg { display: flex; border: 1px solid var(--ctl-line); border-radius: 9px; background: var(--ctl-bg); overflow: hidden; height: 32px; min-width: 0; }
  .seg div { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--muted); border-left: 1px solid var(--ctl-line); white-space: nowrap; padding: 0 8px; }
  .seg div:hover { background: var(--hover); color: var(--text); }
  .seg div > span:not(.dot) { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .seg div:first-child { border-left: 0; }
  .seg div b { font-weight: 500; color: var(--label); font-variant-numeric: tabular-nums; }
  .seg div.on { background: var(--accent-wash); color: var(--accent-text); flex-shrink: 0; }
  .seg div.on b { color: var(--accent-text); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--c); display: inline-block; }

  /* the summary strip: the old panel's summary card, laid along the page (share · bar · the two rows) */
  .sum { display: grid; grid-template-columns: auto minmax(80px, 1fr) minmax(0, 276px); align-items: center; column-gap: 18px; height: 72px; padding: 0 0 0 16px; border-radius: 12px; background: var(--card-bg); border: 1px solid var(--card-line); box-shadow: var(--card-shadow); min-width: 0; }
  .sum .share { white-space: nowrap; }
  .bign { font-size: 30px; font-weight: 700; color: var(--text-strong); line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .bign small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .lbl { color: var(--label); font-size: 11px; margin-top: 5px; }
  .qbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; }
  .qbar i { display: block; background: var(--c); }
  .sum .rows { align-self: stretch; border-left: 1px solid var(--row-line); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .lrow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 12px; align-items: center; gap: 10px; height: 34px; padding: 0 14px; border-top: 1px solid var(--row-line); font-size: 12px; white-space: nowrap; }
  .lrow.go-row:hover { background: var(--hover); }
  .lrow:first-child { border-top: 0; }
  .lrow > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .lrow .n { color: var(--text); font-variant-numeric: tabular-nums; }
  .lrow .chv { color: var(--label); }
  .lrow .q { color: var(--muted); }

  .tbl { border-radius: 12px; background: var(--list-bg); border: 1px solid var(--list-line); min-width: 0; flex: 1 1 auto !important; min-height: 0; margin-bottom: 20px; display: flex; flex-direction: column; overflow: hidden; }
  .scroll { flex: 1; min-height: 0; position: relative; overflow-y: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(#000 calc(100% - 18px), transparent); }
  .scroll::-webkit-scrollbar { display: none; }
  .th-row, .tr { display: grid; grid-template-columns: var(--cols); align-items: center; column-gap: 12px; padding: 0 14px; }
  .th-row { height: 34px; border-bottom: 1px solid var(--row-line); background: var(--list-solid); flex: none; }
  .tr { height: 36px; border-top: 1px solid var(--row-line); font-size: 12px; }
  .tr:hover { background: var(--hover); }
  .tr.sel, .tr.sel:hover { background: var(--accent-wash); }
  .scroll > .tr:first-child { border-top: 0; }
  .tempty { padding: 40px 14px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .tempty a, .kv .v a, .card .ttl .s.lnk { color: var(--accent-text); text-decoration: none; }
  .hc { color: var(--label); font: 500 11px -apple-system; letter-spacing: .7px; text-transform: uppercase; white-space: nowrap; justify-self: start; }
  .hc.on { color: var(--muted); } .hc.r { justify-self: end; }
  .info { justify-self: end; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--ctl-line); color: var(--muted); font: 600 10px -apple-system; display: grid; place-items: center; }
  .t1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cov { width: 22px; height: 22px; border-radius: 4px; flex: none; }
  .nm { color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .cut { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .mu { color: var(--muted); } .lbc { color: var(--label); }
  .len { justify-self: end; color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { justify-self: start; font: 600 11px -apple-system; letter-spacing: .3px; padding: 2px 6px; border-radius: 5px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); color: var(--c); white-space: nowrap; }
  .tr .badge[data-qb]:hover { background: color-mix(in srgb, var(--c) 14%, transparent); }
  .pl { justify-self: start; max-width: 100%; display: inline-flex; gap: 4px; font: 500 11px -apple-system; padding: 2px 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.13); color: var(--muted); white-space: nowrap; overflow: hidden; }
  .pl span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pl b { font-weight: 500; color: var(--label); flex: none; }

  /* ---- the details inspector (Library) and the docked panel (other pages) ---- */
  .panel { flex: none; width: var(--pw, 360px); background: var(--panel-bg); border-left: 1px solid var(--sb-line); padding: 20px; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
  .card { border-radius: 12px; background: var(--card-bg); border: 1px solid var(--card-line); box-shadow: var(--card-shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; flex: none; }
  .card .ttl { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .card .ttl .s { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
  .thead { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; align-items: center; }
  .thead .cv { width: 44px; height: 44px; border-radius: 6px; }
  .thead .a { font-size: 17px; font-weight: 600; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thead .b { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badges { display: flex; gap: 6px; }
  .spec { height: 56px; border-radius: 6px; position: relative; overflow: hidden; background: #050506; border: 1px solid var(--row-line); }
  .spec i { position: absolute; inset: 0; }
  .spec .cutl { position: absolute; left: 0; right: 0; border-top: 1px dashed color-mix(in srgb, var(--c) 75%, transparent); }
  .spec .cutt { position: absolute; right: 6px; font-size: 11px; color: var(--c); background: rgba(0,0,0,.6); padding: 0 3px; border-radius: 3px; }
  .cmp { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 8px 10px; align-items: center; }

  const APP = [['dash', 'Dashboard', '⌘1'], ['sync', 'Sync', '⌘2'], ['todo', 'To-do', '⌘3'], ['pls', 'Playlists', '⌘4'], ['lim', 'Download limits', '⌘5'], ['lib', 'Library', '⌘6']];

  const limitReached = (o) => o.qobuz[0] >= o.qobuz[1];

      <div class="nav settings" data-nav="set" title="Settings (⌘,) · not part of this mockup"><span class="g">${NAVI.set}</span><span class="t">Settings</span></div></div>`;

  function browser(o) {
    const field = `<label class="bfind"><span class="ico">${MAG}</span><input data-field="filter" placeholder="Filter playlists, folders" value="${esc(o.q)}" spellcheck="false" autocomplete="off">${o.q ? '<span class="x" data-x title="Clear (Esc)">✕</span>' : '<kbd>⌘K</kbd>'}</label>`;

  }

  // ---------- the Library page ----------
  const QV = { L: '--good', G: '--ok', W: '--weak', F: '--lossy' };
  const QL = { L: 'LOSSLESS', G: '20.0 kHz', W: '16.0 kHz', F: 'FAKE · 16.0 kHz' };
  const QCUT = { L: 0, G: 91, W: 72, F: 72 };   // the cutoff's height in the spectrum (of 22.05 kHz)
  const grads = ['linear-gradient(135deg,#2fd27a,#1a7cff)', 'linear-gradient(135deg,#ff6a8a,#7a4cff)', 'linear-gradient(135deg,#1a7cff,#f0b93a)', 'linear-gradient(135deg,#f0b93a,#c04aff)', 'linear-gradient(135deg,#7a4cff,#2fd27a)', 'linear-gradient(135deg,#f0524a,#a77bff)'];
  const cover = (t) => grads[[...t.t].reduce((s, ch) => s + ch.charCodeAt(0), 0) % grads.length];
  // where a file sits, as words: its crate in Rekordbox Library, or its Library folder
  const placeOf = (t) => t.home === 'own' ? (t.crate ? crateText(byKey[t.crate]) : t.sub ? `${byKey[t.wf].name} › ${t.sub}` : byKey[t.wf].name) : `Library › ${t.folder}`;
  function pageMeta(x, c) {

    if (x.kind === 'wf') return { parts: [n, `${x.many || shownCrates(x).length + x.crates.filter((d) => d.hidden).length} folders with music`, x.path], subCol: x.crates.length || x.many ? 'Subfolder' : null, plCol: true };
    return { parts: [n, x.tip], subCol: x.subs.length ? 'Subfolder' : null, plCol: true };
  }
  function subOf(t, x) {
    if (x.kind === 'view') return t.home === 'own' ? byKey[t.wf].name : t.folder;

    if (x.kind === 'wf') return crateText(cr);

  }
  const head = (x, parts, o) => `<div class="hd"><h1 title="${esc(nameOf(x))}">${esc(nameOf(x))}</h1><span class="st" title="${esc(parts.join(' · '))}"><span></span>${parts.map((p, i) => `<span>${i ? ' · ' : ''}${esc(p)}</span>`).join('')}</span>
    <label class="search">${MAG}<input data-field="search" placeholder="Search title, artist…" value="${esc(o.search)}" spellcheck="false" autocomplete="off">${o.search ? '<span class="x" data-clear-search title="Clear (Esc)">✕</span>' : '<kbd>⌘F</kbd>'}</label>
    <span class="itog${o.insp ? ' pressed' : ''}" data-itog title="${o.insp ? 'Hide' : 'Show'} details (⌘I)">${INSPICON}</span></div>`;
  const SEGS = [['all', 'All', null], ['L', 'Lossless', '--good'], ['G', 'Good lossy', '--ok'], ['W', 'Weak', '--weak'], ['F', 'Fake', '--lossy'], ['up', 'Upgrade ready', '--good']];
  const seg = (c, on) => `<div class="seg">${SEGS.filter(([k]) => k !== 'F' || c.F > 0 || on === 'F')
    .map(([k, l, d]) => `<div data-seg="${k}"${k === on ? ' class="on"' : ''}>${d ? `<span class="dot" style="--c:var(${d})"></span>` : ''}<span>${l}</span><b>${fmt(k === 'all' ? c.n : c[k])}</b></div>`).join('')}</div>`;
  const toDoPart = (c) => { const nl = c.G + c.W + c.F; return c.todo === 0 ? 'none in To-do' : c.todo === nl ? 'all in To-do' : `${fmt(c.todo)} in To-do`; };
  function summary(c) {

      <div class="qbar" title="Lossless ${fmt(c.L)} · Good lossy ${fmt(c.G)} · Weak ${fmt(c.W)} · Fake ${fmt(c.F)}">${qs.filter(([, n]) => n).map(([v, n]) => `<i style="--c:var(${v});flex:${n}"></i>`).join('')}</div>

  const subc = (s) => s ? `<span class="cut mu" title="${esc(s)}">${placeHtml(s)}</span>` : '<span class="lbc">–</span>';
  // the columns by the table's own width (the container rule): Length first to go, then Playlist, then Subfolder
  function columns(meta, w) {

    if (meta.subCol) { need += 140; if (w >= need) c.push(['s', meta.subCol, 'minmax(116px,.95fr)']); }

  const visibleRows = (pg, o) => {

    const hcell = ([k, h]) => k === 'u' ? '<span class="info" title="Click a row to select it · double-click or Enter plays · ⌘I or a quality badge shows the details">i</span>' : `<span class="hc${k === 'a' ? ' on' : ''}${k === 'l' ? ' r' : ''}">${h}</span>`;

  // a stand-in spectrum: energy falling with height, cut at the file's cutoff

  const FORMAT = { L: ['AIFF · 16-bit · 44.1 kHz', 'aiff'], G: ['MP3 · 320 kbps · 44.1 kHz', 'mp3'], W: ['MP3 · 128 kbps · 44.1 kHz', 'mp3'], F: ['WAV · 16-bit · 44.1 kHz', 'wav'] };

  const BASE = { page: 'lib', sel: 'wf:rb', bw: 240, favs: FAVS, W: 1280, formLib: 'rail', formOther: 'full', q: '', search: '', seg: 'all', selRow: null, insp: false,
    foot: false, playing: 'Kaltfront', sync: null, hiddenPlayer: false, qobuz: [15, 40], az: false, closedSecs: [] };
  const STATES = {

    'filter-none': { label: 'Filter, no match', title: 'A track name typed into the filter (“kaltf”): no playlist or folder matches, so the one row hands the text to the track search (Enter or click opens All tracks searched for it)', o: { q: 'kaltf', focus: 'filter' } },
    'favourites': { label: 'Favourites drag', title: 'Favourites in use: Peak Time is being dragged to the top, the rows below make room; Hardtechno open (its pill on its topmost row)', o: { sel: 'cr:wf:rb:Music/DJ/Hardtechno', drag: { key: 'pl:Peak Time', at: 0 } } },
    'wide': { label: 'Column wider', title: 'The browser column dragged to 320: the edge line in orange follows the pointer; long names come out whole; the table lets Length go', o: { bw: 320, resizing: true } },
    'inspector': { label: 'Details open', title: 'Details open (⌘I, the toggle, or a click on a quality badge): an upgrade-ready track; the table drops to Track, Artist, Subfolder, Quality while it’s open', o: { insp: true, selRow: 'Eisenbahn' } },
    'inspector-1100': { label: 'Details 1100', title: 'Details open at 1100 × 700: below 1240 the browser column steps back behind the rail while the details are open (it returns when they close), so the list keeps Track, Artist, Subfolder, Quality and whole filter labels', o: { W: 1100, insp: true, selRow: 'Eisenbahn' } },
    'library-1100': { label: 'Library 1100', title: 'Library, 1100 × 700, later: a track playing and a sync running; the foot keeps working under the rail and the browser (its line starts at the page’s edge)', o: { W: 1100, foot: true, sync: [12, 40] } },
    'first-look': { label: 'First look', title: 'A new user’s first look: Favourites empty, with its landing row; Playlists folded by its header; the right-click menu on a crate offers Add to favourites and Hide', o: { favs: [], menu: { key: 'cr:wf:rb:Music/DJ/Rock', staged: true }, closedSecs: ['pl'] } },
    'dashboard': { label: 'Dashboard', title: 'Another page: the full sidebar (pages, Library, Favourites as shortcuts), the page’s docked panel as today; Qobuz at 15 of 40, so Download limits has no dot', o: { page: 'dash' } },
    'dashboard-rail': { label: 'Dashboard, folded', title: 'Dashboard with the sidebar folded by hand (⌃⌘S): the same icons in the same places, tooltips name them; Qobuz’s limit reached today (40 of 40), so Download limits carries its yellow dot; the hidden player sits above Settings', o: { page: 'dash', formOther: 'rail', hiddenPlayer: true, tip: 'todo', qobuz: [40, 40] } },
  };

  const pick = document.getElementById('state'), stage = document.getElementById('stage');
  pick.innerHTML = Object.entries(STATES).map(([k, s]) => `${k === 'dashboard' ? '<span class="sep"></span>' : ''}<button data-v="${k}" title="${esc(s.title)}">${s.label}</button>`).join('');
  let stateKey, o, rendering = false, scale = 1, lastPage = null, drag = null, lastRow = { id: null, t: 0 }, lastEdge = 0;

  function load(key) {
    stateKey = STATES[key] ? key : 'library';
    const s = STATES[stateKey].o;
    o = { ...BASE, ...s, favs: [...(s.favs || BASE.favs)], closed: new Set(s.closedSecs || []), kb: null, staged: !!(s.tip || s.drag || s.resizing || (s.menu && s.menu.staged)) };
    pick.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === stateKey));
    lastPage = null;
    render(true);
  }
  function unstage() { if (!o.staged) return; o.staged = false; o.tip = null; o.drag = null; o.resizing = false; if (o.menu && o.menu.staged) o.menu = null; }

  function render(fresh) {
    const win0 = stage.querySelector('[data-win]');
    const keep = !fresh && win0 ? { lib: win0.querySelector('[data-lib]')?.scrollTop, tbl: win0.querySelector('[data-scroll]')?.scrollTop } : null;
    rendering = true;
    const W = o.W, H = W === 1100 ? 700 : 800;
    o.form = o.page === 'lib' ? o.formLib : o.formOther;
    o.browser = o.page === 'lib' && !(o.insp && W < 1240);   // below 1240 the window holds the browser or the details beside the list, not both
    o.qq = o.q.trim().toLowerCase();
    o.used = new Set(); o.cw = folderCw;
    scale = Math.min(1, (stage.clientWidth - 32) / W, (stage.clientHeight - 16) / H);
    const chromeW = (o.form === 'rail' ? 50 : 168) + (o.browser ? o.bw + 1 : 0);
    const left = appSidebar(o, o.form, o.browser) + (o.browser ? browser(o) : '');
    const pageHtml = o.page === 'lib' ? libraryPage(o, W) : dashboardPage(o);
    stage.innerHTML = `<div class="sizer" style="width:${W * scale}px;height:${H * scale}px"><div class="win${o.foot ? ' has-foot' : ''}" data-win style="width:${W}px;height:${H}px;--pw:${W < 1240 ? 320 : 360}px;transform:scale(${scale})"><div class="body">${left}<div class="inner">${pageHtml}</div></div>${o.foot ? foot(o, chromeW, W) : ''}</div></div>`;
    const win = stage.querySelector('[data-win]');
    const lib = win.querySelector('[data-lib]'), sc = win.querySelector('[data-scroll]');
    const at = (el) => { const r = el.getBoundingClientRect(), w = win.getBoundingClientRect(); return { x: (r.left - w.left) / scale, y: (r.top - w.top) / scale, w: r.width / scale, h: r.height / scale }; };
    if (lib && o.qq && o.kb) { const k = lib.querySelector(`[data-k="${CSS.escape(o.kb)}"]`); if (k) k.classList.add('kb'); }
    // scroll: kept while the user works; a state, an opened collection or a moved highlight brings its row into view
    const pageId = o.page + ':' + o.sel;
    if (keep && lib && keep.lib != null) lib.scrollTop = keep.lib;
    if (keep && sc && keep.tbl != null && pageId === lastPage) sc.scrollTop = keep.tbl;
    lastPage = pageId;
    const into = (box, el, pad) => { if (!box || !el) return; const top = el.offsetTop, bot = top + el.offsetHeight; if (top < box.scrollTop + pad) box.scrollTop = top - pad; else if (bot > box.scrollTop + box.clientHeight - pad) box.scrollTop = bot - box.clientHeight + pad; };
    if (lib && !o.qq && (fresh || o.reveal)) { const selEl = lib.querySelector('.nav.on'); if (selEl && fresh) { if (selEl.offsetTop + 40 > lib.clientHeight) lib.scrollTop = selEl.offsetTop - lib.clientHeight + 130; } else into(lib, selEl, 40); }
    if (lib && o.qq && o.revealKb) into(lib, lib.querySelector('.nav.kb'), 36);
    if (sc && (fresh || o.revealRow)) { const r = sc.querySelector('.tr.sel'); if (r && fresh) { if (r.offsetTop + 60 > sc.clientHeight) sc.scrollTop = r.offsetTop - sc.clientHeight / 2; } else into(sc, r, 8); }
    if (lib && (fresh || o.reveal || o.revealKb)) clearHeads(lib);
    o.reveal = o.revealKb = o.revealRow = false;
    if (lib) { stuck(lib); lib.addEventListener('scroll', () => stuck(lib), { passive: true }); }
    // the context menu (staged on a row, or where the user right-clicked)
    if (o.menu) {
      const x = byKey[o.menu.key], rowEl = win.querySelector('.menu-on');
      let px = o.menu.x, py = o.menu.y;
      if (o.menu.staged && rowEl) { const r = at(rowEl); px = r.x + 80; py = r.y + 18; }
      const fav = o.favs.includes(x.key);
      const items = `<div data-mi="open">Open</div><div data-mi="play">Play</div><hr><div data-mi="fav"${o.menu.staged ? ' class="hov"' : ''}>${fav ? 'Remove from favourites' : 'Add to favourites'}</div>${x.kind === 'crate' ? '<div data-mi="close">Hide from sidebar<span>Settings brings it back</span></div>' : ''}<hr><div data-mi="close">Show in Finder</div>`;
      win.insertAdjacentHTML('beforeend', `<div class="cmenu" style="left:${Math.min(px + 4, W - 250)}px;top:${Math.min(py, H - 180)}px">${items}</div>` + (o.menu.staged ? cur(ARROW, px, py - 4) : ''));
    }
    if (o.tip === 'crate') {
      const el = win.querySelector('[data-k="cr:wf:rb:Music/Old Sets/Bounce"]');
      if (el) { const r = at(el), cx = r.x + r.w - 44; win.insertAdjacentHTML('beforeend', `<div class="tip" style="left:${cx + 8}px;top:${r.y + r.h + 3}px">Rekordbox Library › Music › Old Sets › Bounce<br><span class="lb">61 files</span></div>` + cur(ARROW, cx, r.y + 18)); }
    }
    if (o.tip === 'todo') {
      const r = at(win.querySelector('[data-nav="todo"]'));
      win.insertAdjacentHTML('beforeend', `<div class="tip" style="left:${r.x + r.w + 8}px;top:${r.y + 4}px">To-do · ${TODO} to look at<kbd>⌘3</kbd></div>` + cur(ARROW, r.x + 16, r.y + 14));
    }
    if (o.drag) {
      const sl = win.querySelector('[data-slot]'), r = at(sl), x = byKey[o.drag.key], libr = at(lib);
      lib.insertAdjacentHTML('beforeend', `<div class="nav lift" style="top:${r.y - libr.y + lib.scrollTop}px"><span class="g">${SVC[x.svc]}</span><span class="t">${x.name}</span><span class="c">${x.n}</span></div>`);
      win.insertAdjacentHTML('beforeend', cur(HAND, r.x + 124, r.y + 12));
    }
    if (o.resizing && o.staged) { const r = at(win.querySelector('[data-edge]')); win.insertAdjacentHTML('beforeend', cur(RESIZE, r.x - 7, 310)); }
    if (o.focus) { const f = win.querySelector(`[data-field="${o.focus}"]`); if (f) { f.focus({ preventScroll: true }); const p = o.caret ?? f.value.length; f.setSelectionRange(p, p); } }
    o.caret = null;
    rendering = false;
  }
  // a row the code scrolls to never stops half under a stuck section head: it shows whole, just below it
  function clearHeads(lib) {
    const st = lib.scrollTop, h = 28;
    if (st <= 0) return;
    const r = [...lib.querySelectorAll(':scope > .nav, :scope > .hintrow')].find((el) => el.offsetTop < st + h && el.offsetTop + el.offsetHeight > st + h);
    if (r) lib.scrollTop = r.offsetTop - h - 2;
  }
  // a section head that stands over rows gets its hairline (top or foot of the list)
  function stuck(lib) {
    const lr = lib.getBoundingClientRect();
    const more = lib.scrollTop + lib.clientHeight < lib.scrollHeight - 1;
    lib.querySelectorAll('.sh').forEach((h) => {
      const r = h.getBoundingClientRect();
      h.classList.toggle('stuck-t', lib.scrollTop > 0 && r.top - lr.top < 1);
      h.classList.toggle('stuck-b', more && lr.bottom - r.bottom < 1 && !(lib.scrollTop > 0 && r.top - lr.top < 1));
    });
  }

  // ---------- what the user can do ----------
  function open(key) {
    unstage();
    if (key === 'handoff') { o.search = o.q.trim(); key = 'all'; o.focus = 'search'; } else o.focus = null;
    o.page = 'lib'; o.sel = key; o.q = ''; o.kb = null; o.seg = 'all'; if (key !== 'all') o.search = ''; o.selRow = null; o.menu = null; o.reveal = true;
  }
  const libFocus = () => { o.page = 'lib'; if (o.insp && o.W < 1240) o.insp = false; o.focus = 'filter'; };
  function toggleInsp() { if (o.page !== 'lib') return; o.insp = !o.insp; }
  function play(id) { o.playing = id; o.foot = true; }
  function fold() { if (o.page === 'lib') o.formLib = o.formLib === 'rail' ? 'full' : 'rail'; else o.formOther = o.formOther === 'rail' ? 'full' : 'rail'; }
  function moveRow(d) {
    if (o.page !== 'lib' || byKey[o.sel].away) return;
    const rows = visibleRows(pageOf(o.sel), o); if (!rows.length) return;
    const i = rows.findIndex((t) => t.id === o.selRow);
    o.selRow = rows[Math.max(0, Math.min(rows.length - 1, i < 0 ? 0 : i + d))].id; o.revealRow = true;
  }

  stage.addEventListener('click', (e) => {
    const t = e.target, win = t.closest('[data-win]');
    if (!win) return;
    unstage();
    const mi = t.closest('[data-mi]');
    if (mi) {
      const k = o.menu.key, a = mi.dataset.mi;
      o.menu = null;
      if (a === 'open') open(k);
      else if (a === 'fav') o.favs = o.favs.includes(k) ? o.favs.filter((f) => f !== k) : [...o.favs, k];
      render(); return;
    }
    if (o.menu && !t.closest('.cmenu')) { o.menu = null; render(); return; }
    let el;
    if (t.closest('[data-tog]')) fold();
    else if ((el = t.closest('[data-nav]'))) {
      const k = el.dataset.nav;
      if (k === 'lib') { if (o.page === 'lib' && o.insp && o.W < 1240) o.insp = false; o.page = 'lib'; o.focus = null; }
      else if (k === 'dash') { o.page = 'dash'; o.focus = null; }
      else return;
    }
    else if (t.closest('[data-sort]')) o.az = !o.az;
    else if ((el = t.closest('[data-fold]')) && !o.qq) { const k = el.dataset.fold; o.closed.has(k) ? o.closed.delete(k) : o.closed.add(k); }
    else if ((el = t.closest('[data-sec]'))) { if (o.qq) return; const k = el.dataset.sec; o.closed.has(k) ? o.closed.delete(k) : o.closed.add(k); }
    else if ((el = t.closest('[data-k]'))) open(el.dataset.k);
    else if (t.closest('[data-x]')) { o.q = ''; o.kb = null; o.focus = 'filter'; }
    else if (t.closest('[data-clear-search]')) { e.preventDefault(); o.search = ''; o.focus = 'search'; }
    else if (t.closest('[data-itog]')) toggleInsp();
    else if ((el = t.closest('[data-row]'))) {
      o.selRow = el.dataset.row;
      if (t.closest('[data-qb]')) o.insp = true;          // the quality badge asks "why is this weak?"
      else if (lastRow.id === el.dataset.row && e.timeStamp - lastRow.t < 450) play(el.dataset.row);   // double-click plays
      lastRow = { id: el.dataset.row, t: e.timeStamp };
    }
    else if ((el = t.closest('[data-seg]'))) o.seg = el.dataset.seg;
    else if (t.closest('[data-foot-x]')) o.foot = false;
    else if (t.closest('input')) return;
    else return;
    render();
  });
  stage.addEventListener('contextmenu', (e) => {
    const el = e.target.closest('[data-browser] [data-k]');
    if (!el || el.dataset.k === 'handoff') return;
    e.preventDefault(); unstage();
    const w = stage.querySelector('[data-win]').getBoundingClientRect();
    o.menu = { key: el.dataset.k, x: (e.clientX - w.left) / scale, y: (e.clientY - w.top) / scale };
    render();
  });
  stage.addEventListener('input', (e) => {
    const f = e.target.dataset.field;
    if (f === 'filter') { o.q = e.target.value; o.kb = null; }
    else if (f === 'search') { o.search = e.target.value; }
    else return;
    unstage(); o.focus = f; o.caret = e.target.selectionStart; render();
  });
  stage.addEventListener('focusin', (e) => { if (!rendering && e.target.dataset.field) o.focus = e.target.dataset.field; });
  stage.addEventListener('focusout', (e) => { if (!rendering && e.target.dataset.field) o.focus = null; });
  // drag the browser's edge: 1:1 with the pointer, 200–360
  stage.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('[data-edge]') || e.button !== 0) return;
    e.preventDefault(); unstage();
    if (e.timeStamp - lastEdge < 400) { lastEdge = 0; o.bw = 240; render(); return; }   // double-click: back to 240
    lastEdge = e.timeStamp;
    drag = { x0: e.clientX, bw0: o.bw }; o.resizing = true; document.body.classList.add('resizing'); render();
  });
  addEventListener('pointermove', (e) => { if (!drag) return; const bw = Math.round(Math.max(200, Math.min(360, drag.bw0 + (e.clientX - drag.x0) / scale))); if (bw !== o.bw) { o.bw = bw; render(); } });
  addEventListener('pointerup', () => { if (!drag) return; drag = null; o.resizing = false; document.body.classList.remove('resizing'); render(); });

  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase(), field = e.target.dataset && e.target.dataset.field;
    if (e.metaKey && e.ctrlKey && k === 's') { e.preventDefault(); unstage(); fold(); render(); return; }
    if (e.metaKey && !e.ctrlKey && k === 'k') { e.preventDefault(); unstage(); libFocus(); render(); return; }
    if (e.metaKey && !e.ctrlKey && k === 'i') { e.preventDefault(); unstage(); toggleInsp(); render(); return; }
    if (e.metaKey && !e.ctrlKey && k === 'f') { if (o.page !== 'lib') return; e.preventDefault(); unstage(); o.focus = 'search'; render(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (field === 'filter') {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!o.qq || !o.targets) return;
        e.preventDefault(); unstage();
        const i = o.targets.indexOf(o.kb); o.kb = o.targets[Math.max(0, Math.min(o.targets.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
        o.revealKb = true; o.caret = e.target.selectionStart; render();
      } else if (e.key === 'Enter') { if (!o.qq || !o.kb) return; e.preventDefault(); open(o.kb); render(); }
      else if (e.key === 'Escape') { e.preventDefault(); unstage(); o.q = ''; o.kb = null; o.focus = null; e.target.blur(); render(); }
      return;
    }
    if (field === 'search') { if (e.key === 'Escape') { e.preventDefault(); o.search = ''; o.focus = null; render(); } return; }
    if (e.target.closest && e.target.closest('input, textarea, button')) return;
    if (e.key === 'Escape' && o.menu) { o.menu = null; render(); return; }
    if (o.page !== 'lib') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); unstage(); moveRow(e.key === 'ArrowDown' ? 1 : -1); render(); }
    else if (e.key === 'Enter' && o.selRow) { e.preventDefault(); play(o.selRow); render(); }
  });

  pick.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; history.replaceState(null, '', '#' + b.dataset.v); load(b.dataset.v); });
  addEventListener('hashchange', () => load(location.hash.slice(1)));
  addEventListener('resize', () => render());

  // a self-check of the made-up data: every collection's files agree with its counts, its upgrades exactly
  for (const key of Object.keys(byKey)) {
    if (byKey[key].away) continue;
    const { c, all } = pageOf(key), q = { L: 0, G: 0, W: 0, F: 0 };
    all.forEach((t) => { q[t.q]++; if (t.up && t.q === 'L') console.error('upgrade on a lossless file', key, t.t); });
    if (c.L + c.G + c.W + c.F !== c.checked || c.checked > c.n) console.error('qualities do not add up', key, c);
    for (const k of ['L', 'G', 'W', 'F']) if (q[k] > c[k] || q[k] < Math.min(c[k], ROWCAP)) console.error('files of quality', k, q[k], 'vs the count', c[k], key);
    if (all.filter((t) => t.up).length !== c.up || c.up > c.G + c.W + c.F) console.error('upgrades do not agree', key, all.filter((t) => t.up).length, c.up);
    if (c.todo > c.G + c.W + c.F || c.todo < c.up) console.error('To-do part does not fit', key, c);
    if (new Set(all.map((t) => t.a + '|' + t.t)).size !== all.length) console.error('a title twice by one artist', key);
  }
  load(location.hash.slice(1));
})();
</script>
</body></html>
