<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Sources round</title>
<!-- Sources round: the app window at real size and a state switcher, nothing else. The reasons are in
     sources-round-notes.md. Every name, link and account here is made up. -->
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #111; color: #9a9aa0; font: 13px -apple-system, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  .bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px; }
  .bar h2 { margin: 0; color: #f2f2f4; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pick { display: inline-flex; flex-wrap: wrap; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
  .pick button { background: none; border: 0; border-left: 1px solid #333; color: #9a9aa0; font: 12px -apple-system; padding: 6px 10px; cursor: pointer; }
  .pick button:first-child { border-left: 0; }
  .pick button:hover { color: #dcdce0; }
  .pick button.on { background: rgba(255,90,31,.16); color: #ff8a5a; }
  .bar .notes { margin-left: auto; color: #9a9aa0; font-size: 12px; text-decoration: none; }
  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px 16px; }
  .sizer { flex: none; position: relative; }

  /* ---- tokens as tokens.css / library-layout.html ---- */
  .win { --bg: #000; --sb-bg: linear-gradient(#0b0b0d, #070708); --sb-line: rgba(255,255,255,.07); --panel-bg: #040405; --text: #dcdce0; --text-strong: #f4f4f6; --muted: #9a9aa2; --label: #5c5c64; --nav: #7c7c84;
    --accent: #ff5a1f; --accent-text: #ff8a5a; --accent-wash: rgba(255,90,31,.14); --ctl-line: rgba(255,255,255,.09); --ctl-bg: rgba(255,255,255,.03); --ctl-hover: rgba(255,255,255,.05); --line-control-hover: rgba(255,255,255,.18);
    --list-bg: linear-gradient(#0c0c0e, #08080a); --list-line: rgba(255,255,255,.06); --row-line: rgba(255,255,255,.045);
    --card-bg: linear-gradient(#0f0f12, #0a0a0c); --card-line: rgba(255,255,255,.07); --card-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 1px 2px rgba(0,0,0,.6);
    --good: #2fd27a; --ok: #e8b93a; --weak: #f0524a; --lossy: #a77bff; --wait: #e8b93a; --nav-on: rgba(255,255,255,.07);
    --warn-bg: rgba(232,185,58,.06); --warn-line: rgba(232,185,58,.28);
    position: absolute; left: 0; top: 0; transform-origin: 0 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; background: var(--sb-bg); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); cursor: default; }
  .win * { box-sizing: border-box; }
  .body { flex: 1; min-height: 0; display: flex; }
  .inner { flex: 1; min-width: 0; display: flex; background: var(--bg); border-left: 1px solid var(--sb-line); }

  /* sidebar (full 168, rail 50) and Library's browser column */
  .sb { width: 168px; flex: none; padding: 16px 10px 14px; display: flex; flex-direction: column; gap: 2px; }
  .sb.rail { width: 50px; }
  .sb.beside { border-right: 1px solid var(--sb-line); }
  .shead { display: flex; align-items: center; height: 22px; margin: 0 0 8px; }
  .tog { width: 30px; height: 22px; display: grid; place-items: center; color: var(--label); }
  .brand { color: #9a9aa0; font-weight: 700; }
  .rail .brand, .rail .nl, .rail .nc { display: none; }
  .nav { display: flex; align-items: center; height: 30px; padding: 0 8px; border-radius: 7px; color: var(--nav); white-space: nowrap; position: relative; }
  .nav.on { color: var(--text-strong); background: var(--nav-on); }
  .rail .nav { width: 30px; }
  .nav .g { width: 14px; height: 14px; flex: none; display: grid; place-items: center; position: relative; }
  .nav .nl { margin-left: 9px; flex: 1; }
  .nav .nc { color: var(--label); font-variant-numeric: tabular-nums; font-size: 12px; }
  .nav .dot { position: absolute; right: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--wait); }
  .rail .pill { position: absolute; left: 13px; top: -6px; background: #2a2a30; color: var(--text); font-size: 11px; border-radius: 8px; padding: 0 4px; line-height: 14px; }
  .sb .grow { flex: 1; }
  .browser { width: 240px; flex: none; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
  .bsearch { height: 26px; border: 1px solid var(--ctl-line); border-radius: 8px; display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--label); font-size: 12px; margin-bottom: 10px; }
  .bsearch .cap, .cap { margin-left: auto; border: 1px solid var(--ctl-line); border-radius: 4px; padding: 0 4px; font-size: 11px; color: var(--label); }
  .bsec { height: 28px; display: flex; align-items: center; padding: 0 8px; color: var(--muted); font-weight: 600; margin-top: 8px; }
  .bsec .nc { margin-left: 6px; color: var(--label); font-weight: 400; }
  .brow { height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 7px; color: var(--text); }
  .brow.on { background: var(--nav-on); color: var(--text-strong); }
  .brow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .nc { color: var(--label); font-size: 12px; font-variant-numeric: tabular-nums; }
  .brow.off { opacity: .5; }
  .svc { display: inline-grid; place-items: center; width: 14px; height: 14px; flex: none; }
  .svc svg { display: block; }

  /* frames */
  .listarea { flex: 1; min-width: 0; padding: 16px 20px 20px; display: flex; flex-direction: column; overflow: hidden; }
  .content { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; flex: 1; }
  .content.wide { max-width: 1200px; }
  .panel { flex: none; border-left: 1px solid var(--sb-line); background: var(--panel-bg); padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
  .panel .pfoot { margin-top: auto; display: flex; gap: 10px; }
  .colframe { flex: 1; padding: 16px 20px 20px; display: flex; flex-direction: column; overflow: hidden; }
  .colframe .content { flex: 1; }

  /* page header */
  .ph { display: flex; align-items: center; gap: 12px; min-height: 34px; flex: none; }
  .ph .lead { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1; }
  .ph h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--text-strong); white-space: nowrap; letter-spacing: -.01em; }
  .ph .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .ph .acts { display: flex; align-items: center; gap: 12px; flex: none; }
  .readst { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* controls */
  .btn { height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--ctl-line); background: var(--ctl-bg); color: var(--text); font: 600 13px -apple-system; white-space: nowrap; flex: none; }
  .btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }
  .btn.primary { border-color: var(--accent); color: var(--accent-text); background: none; }
  .btn.filled { border: 0; background: linear-gradient(#ff6c33, #ff5a1f); color: #160700; border-radius: 10px; box-shadow: 0 0 18px rgba(255,90,31,.3), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn.off { color: var(--label); }
  .btn.wide { flex: 1; justify-content: center; }
  .btn .n { font-variant-numeric: tabular-nums; }
  .lnk { color: var(--accent-text); font-weight: 600; white-space: nowrap; }
  .lnk .ext { font-weight: 400; margin-left: 3px; }
  .field { height: 34px; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid var(--ctl-line); border-radius: 8px; background: rgba(0,0,0,.4); color: var(--text-strong); white-space: nowrap; overflow: hidden; }
  .field .ph-t { color: var(--nav); }
  .field .logos { display: inline-flex; gap: 6px; align-items: center; }
  .field .val { overflow: hidden; text-overflow: ellipsis; }
  .addrow { display: flex; gap: 12px; flex: none; }
  .sw { width: 34px; height: 20px; border-radius: 10px; background: #2a2a2f; position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #8c8c92; }
  .sw.on { background: var(--accent); }
  .sw.on::after { left: 16px; background: #fff; }
  .seg { display: flex; border: 1px solid var(--ctl-line); border-radius: 8px; overflow: hidden; height: 34px; flex: none; }
  .seg > span { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--text); border-left: 1px solid var(--ctl-line); white-space: nowrap; font-size: 13px; }
  .seg > span:first-child { border-left: 0; }
  .seg > span.on { background: var(--accent-wash); color: var(--accent-text); }
  .seg .c { color: var(--label); font-variant-numeric: tabular-nums; }
  .seg .d { width: 7px; height: 7px; border-radius: 50%; }

  /* surfaces */
  .card { background: var(--card-bg); border: 1px solid var(--card-line); border-radius: 12px; box-shadow: var(--card-shadow); padding: 14px 16px; flex: none; }
  .sl { background: var(--list-bg); border: 1px solid var(--list-line); border-radius: 12px; box-shadow: var(--card-shadow); flex: none; overflow: hidden; }
  .sl.grow { flex: 1; min-height: 0; }
  .tbl { -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent); }
  .slh { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; white-space: nowrap; }
  .lab { font-weight: 600; color: var(--text-strong); }
  .sum { font-size: 12px; color: var(--muted); }
  .slh .right { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .chev { color: var(--label); display: inline-grid; place-items: center; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; border-top: 1px solid var(--row-line); }
  .row.sel { background: rgba(255,255,255,.05); }
  .row .lines { flex: 1; min-width: 0; }
  .row .t { color: var(--text-strong); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t.n { font-weight: 400; color: var(--text); }
  .row .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .row .s .x { overflow: hidden; text-overflow: ellipsis; }
  .row .s .prob { color: var(--weak); }
  .found .s .x, .row .s .x { white-space: nowrap; }
  .num { width: 18px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .drag { color: var(--label); flex: none; width: 10px; font-size: 11px; letter-spacing: -1px; }
  .cov { width: 28px; height: 28px; border-radius: 5px; flex: none; }
  .cov.dash { border: 1px dashed var(--line-control-hover); background: none; }
  .cnt { width: 28px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; flex: none; }
  .more { width: 20px; text-align: center; color: var(--label); flex: none; }
  .qcol { width: 132px; flex: none; }
  .qbar { display: flex; height: 3px; border-radius: 2px; overflow: hidden; gap: 1px; }
  .qbar i { display: block; height: 100%; }
  .qcol .w { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; border: 1px solid currentColor; font-size: 11px; font-weight: 700; letter-spacing: .7px; white-space: nowrap; flex: none; }
  .b-good { color: var(--good); } .b-weak { color: var(--weak); } .b-ok { color: var(--ok); }
  .kv { display: flex; gap: 8px; min-height: 24px; align-items: baseline; padding: 3px 0; }
  .kv .k { width: 76px; flex: none; font-size: 11px; letter-spacing: .7px; text-transform: uppercase; color: var(--label); }
  .kv .v { flex: 1; min-width: 0; color: var(--text); }
  .kv .v .l2 { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .cut { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .note { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--card-line); background: var(--card-bg); color: var(--text); font-size: 12px; line-height: 1.45; flex: none; }
  .note.warn { border-color: var(--warn-line); background: var(--warn-bg); }
  .note .ic { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.3px solid var(--muted); color: var(--muted); display: grid; place-items: center; font-size: 10px; font-weight: 700; margin-top: 1px; }
  .note.warn .ic { border-color: var(--wait); color: var(--wait); }
  .hint { font-size: 12px; color: var(--muted); }
  .info { width: 14px; height: 14px; border-radius: 50%; border: 1.2px solid var(--label); color: var(--label); display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; flex: none; }

  /* NumberedSteps */
  .steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .steps li { display: flex; gap: 10px; align-items: flex-start; }
  .steps .r { width: 20px; height: 20px; border-radius: 50%; border: 1.3px solid var(--line-control-hover); color: var(--muted); font-size: 11px; display: grid; place-items: center; flex: none; font-variant-numeric: tabular-nums; }
  .steps .tx { padding-top: 1px; line-height: 1.4; }

  /* LinkGuide (the new block): one row per service, columns by container query */
  .lg { container-type: inline-size; }
  .lg .row { min-height: 48px; }
  .lg .gn { width: 112px; flex: none; color: var(--text); white-space: nowrap; }
  .lg .gw { width: 240px; flex: none; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .lg .gx { flex: 1; min-width: 0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
  .lg .stack { display: none; }
  @container (min-width: 560px) { .lg .gx { display: block; } }
  @container (max-width: 400px) { .lg .gn, .lg .gw { display: none; } .lg .stack { display: block; flex: 1; min-width: 0; } }
  .lg .stack .a { color: var(--text); } .lg .stack .b { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* found card (AddRow) */
  .found { display: flex; flex-direction: column; gap: 14px; }
  .found .top { display: flex; gap: 14px; align-items: center; }
  .found .bigcov { width: 56px; height: 56px; border-radius: 8px; flex: none; }
  .found .bigcov.dash { border: 1px dashed var(--line-control-hover); }
  .found .nm { color: var(--text-strong); font-size: 13px; font-weight: 600; }
  .found .s { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
  .found .st { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .found .fold { display: flex; gap: 12px; align-items: center; }
  .found .fold .fl { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* Library */
  .search { height: 34px; width: 340px; flex: none; border: 1px solid var(--ctl-line); border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--label); }
  .ib { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; border: 1px solid var(--ctl-line); color: var(--muted); }
  .ib.on { background: var(--accent-wash); color: var(--accent-text); border-color: transparent; }
  .strip { display: flex; height: 72px; flex: none; padding: 0; }
  .strip .l { flex: 1; min-width: 0; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 6px; border-right: 1px solid var(--row-line); }
  .strip .big { display: flex; align-items: baseline; gap: 6px; }
  .strip .big b { font-size: 30px; font-weight: 700; color: var(--text-strong); font-variant-numeric: tabular-nums; line-height: 1; }
  .strip .big .u { color: var(--muted); }
  .strip .big .qbar { flex: 1; margin-left: 14px; align-self: center; height: 5px; }
  .strip .cap2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .r { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .strip .r div { flex: 1; display: flex; align-items: center; gap: 10px; padding: 0 16px; white-space: nowrap; }
  .strip .r div + div { border-top: 1px solid var(--row-line); }
  .strip .r .c { margin-left: auto; font-variant-numeric: tabular-nums; }
  .qbar .wait { background: none; border: 1px dashed var(--line-control-hover); border-radius: 2px; }
  .tbl .th { display: flex; height: 36px; align-items: center; padding: 0 16px; gap: 12px; font-size: 11px; letter-spacing: .7px; color: var(--label); text-transform: uppercase; }
  .tbl .tr { display: flex; height: 46px; align-items: center; padding: 0 16px; gap: 12px; border-top: 1px solid var(--row-line); }
  .tbl .tr.sel { background: rgba(255,255,255,.06); }
  .tbl .c1 { width: 22px; text-align: right; color: var(--label); font-variant-numeric: tabular-nums; }
  .tbl .c2 { flex: 1.3; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .tbl .c2 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-strong); }
  .tbl .c3 { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbl .c4 { width: 120px; flex: none; }
  .tbl .q { color: var(--muted); font-size: 12px; }
  .thead { display: flex; gap: 14px; align-items: center; }
  .thead .cv { width: 64px; height: 64px; border-radius: 8px; flex: none; }
  .thead .a { font-size: 17px; font-weight: 600; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thead .b { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thead .st { display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; row-gap: 20px; height: 20px; margin-top: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  /* the badge's word shows whole or not at all: when it doesn't fit beside the badge it wraps onto a line the card hides; the badge's tip says it */
  .thead .st .w { flex: none; }
  /* Hide sits beside the title only, so the meta and badge lines keep the full text column */
  .thead { position: relative; }
  .thead .hide { position: absolute; top: 0; right: 0; color: var(--muted); }
  .thead:has(.hide) .a { padding-right: 40px; }
  .openin { display: flex; align-items: center; gap: 8px; margin: 12px -16px -14px; padding: 0 16px; height: 36px; border-top: 1px solid var(--row-line); font-size: 12px; }
  .spec { height: 56px; border-radius: 6px; background: linear-gradient(0deg, #ff7a2a 0%, #c43a8a 30%, #4b2ad0 60%, #1b0f3a 85%, #000 100%); opacity: .85; margin: 10px 0; }
  .mp { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .pbtn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--accent); display: grid; place-items: center; color: var(--accent); font-size: 10px; flex: none; }
  .wave { flex: 1; height: 16px; background: repeating-linear-gradient(90deg, #555 0 1px, transparent 1px 3px); opacity: .7; }
  .tm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chead { display: flex; align-items: center; justify-content: space-between; }

  /* To-do upgrade card */
  .upc { border-color: rgba(47,210,122,.45); }
  .upc .two { display: flex; gap: 12px; margin-top: 10px; }
  .upc .two > div { flex: 1; min-width: 0; }
  .upc .mini { height: 34px; border-radius: 5px; background: linear-gradient(0deg, #ff7a2a 0%, #c43a8a 35%, #4b2ad0 70%, #1b0f3a 100%); opacity: .8; }
  .upc .cp { font-size: 11px; letter-spacing: .7px; color: var(--label); margin-top: 8px; }
  .upc .vv { color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Sync */
  .syncc { display: flex; gap: 20px; padding: 20px; }
  .syncc .bigcv { width: 120px; height: 120px; border-radius: 10px; flex: none; }
  .syncc .kick { font-size: 11px; letter-spacing: .7px; text-transform: uppercase; color: var(--label); }
  .syncc .ttl { font-size: 17px; font-weight: 700; color: var(--text-strong); margin-top: 2px; }
  .syncc .from { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .stepbar { display: flex; gap: 4px; margin-top: 14px; }
  .stepbar span { flex: 1; font-size: 11px; color: var(--label); border-top: 2px solid #26262b; padding-top: 6px; }
  .stepbar span.d { border-color: var(--accent); color: var(--muted); }
  .stepbar span.c { border-color: var(--accent); color: var(--text-strong); }
  .prog { height: 4px; border-radius: 2px; background: #1c1c20; margin-top: 10px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--accent); }
  .stepstrip { display: flex; gap: 12px; flex: none; }
  .stepstrip > span { flex: 1; min-width: 0; text-overflow: ellipsis; height: 34px; border: 1px solid var(--ctl-line); border-radius: 8px; display: flex; align-items: center; gap: 8px; padding: 0 10px; white-space: nowrap; overflow: hidden; color: var(--muted); font-size: 12px; }
  .stepstrip > span.cur { border-color: var(--accent); color: var(--text-strong); }

      <div class="st">Discjockey reads it through your YouTube login</div></div><span class="lnk" style="color:var(--muted)">Cancel</span></div>
      <div class="fold"><span class="fl">Folder name</span><div class="field"><span class="val">Liked_music</span></div><span class="btn primary">Add to the list</span></div></div>`;
  }

  function playlistsPage(mode) {
    const empty = mode === 'empty';
    const value = mode === 'liked-off' || mode === 'liked-on' ? 'https://music.youtube.com/playlist?list=LM' : '';
    const main = `${plHeader(empty)}${addRow(value)}${value ? foundCard(mode) : ''}${empty
      ? `<div class="card" style="padding:40px 20px;text-align:center"><div style="color:var(--text)">No playlists yet.</div><div class="hint" style="margin-top:8px">Paste a link above to add your first one.</div></div>`
      : playlistsList()}`;
    return `${sidebar('playlists', false, false, empty)}<div class="inner"><div class="listarea"><div class="content">${main}</div></div>
      <div class="panel" style="width:${pw()}px">${empty ? plPanelEmpty() : plPanelNormal()}</div></div>`;
  }

  // ---- Settings ----
  function settingsPage(on) {
    const rung = (c, a, b, badge) => `<div class="rung"><span class="dt" style="background:var(--${c})"></span><span class="lines"><div class="x1">${a}</div><div class="x2">${b}</div></span>${badge}</div>`;
    const srow = (ic, a, b, sel, mark = '<span class="ck">✓</span>') => `<div class="row ${sel ? 'sel' : ''}"><span class="rowic">${ic}</span><span class="lines"><div class="t n">${a}</div><div class="s"><span class="x">${b}</span></div></span>${mark}</div>`;
    const grp = (n) => `<div class="slh" style="border-top:1px solid var(--row-line)"><span class="lab">${n}</span></div>`;
    const main = `${header('Settings', '')}
      <div class="card ladder"><div class="slh" style="padding:0;height:28px"><span class="lab">Where your music comes from</span><span class="right">best first</span></div>
        ${rung('good', 'Qobuz', 'signed in', '<span class="badge b-good">LOSSLESS</span>')}
        ${rung('good', "The artist's own file", 'SoundCloud download button · no login needed', '<span class="badge b-good">OFTEN LOSSLESS</span>')}
        ${rung('ok', 'Premium streams', 'through YouTube Premium and SoundCloud Go+', '<span class="badge b-ok">~256 KBPS</span>')}
        ${rung('weak', 'Free streams', 'YouTube Music, SoundCloud, YouTube · the last resort', '<span class="badge b-weak">~130 KBPS</span>')}</div>
      <div class="sl grow"><div class="slh"><span class="lab">Downloads</span></div>
        ${srow(logo('qobuz'), 'Qobuz', 'signed in · checked today')}${srow(logo('youtube'), 'YouTube Premium', 'via Chrome (DJ) · 256 kbps · checked today')}${srow(logo('soundcloud'), 'SoundCloud Go+', 'via Chrome · 256 kbps · checked today')}
        ${grp('Reading playlists')}
        ${srow(logo('spotify'), 'Spotify', 'connected as DJ One')}
        ${srow(logo('youtubemusic'), 'YouTube Music', on ? 'public playlists · Liked music on' : 'public playlists · Liked music off', true)}
        ${grp('This Mac')}${srow('▤', 'Music folder', '~/Music/Discjockey')}</div>`;
    const panel = `<div class="card"><div class="chead"><span class="lab">YouTube Music</span></div><div class="hint" style="margin-top:4px">Public and unlisted playlists need no login.</div></div>
      <div class="sl"><div class="row" style="border-top:0"><span class="lines"><div class="t n">Read my Liked music</div><div class="s"><span class="x">uses your YouTube login</span></div></span><span class="sw ${on ? 'on' : ''}"></span></div></div>
      <div class="note warn"><span class="ic">!</span><span>Every read signs in with your YouTube account, the one your downloads use. Many reads can set off YouTube's bot check, which pauses downloads from YouTube for a while.</span></div>
      ${on ? '<div style="display:flex"><span class="btn primary">Add Liked music to Playlists</span></div>' : ''}`;
    return `${sidebar('settings')}<div class="inner"><div class="listarea"><div class="content">${main}</div></div><div class="panel" style="width:${pw()}px">${panel}</div></div>`;
  }

  // ---- Setup ----
  function setupPage(added) {
    const steps = ['Music folder', 'Existing music', 'Programs', 'Spotify', 'Downloads', 'First playlist'];
    const strip = `<div class="stepstrip">${steps.map((s, i) => `<span class="${i === 5 ? 'cur' : ''}"><span class="ok">${i === 5 ? '6' : '✓'}</span><span class="tx">${s}</span></span>`).join('')}</div>`;
    const card = `<div class="card"><div style="display:flex;gap:8px;align-items:baseline;margin-bottom:12px"><span class="lab">Add a playlist</span><span class="sum">Discjockey keeps each playlist's tracks in a folder of its own.</span></div>${addRow('')}</div>`;
    const list = added ? `<div class="sl"><div class="slh"><span class="lab">Your playlists</span><span class="sum">2 playlists</span></div>
      <div class="row"><span class="cov" style="background:${cover('Peak_Time')}"></span><span class="lines"><div class="t">Peak_Time</div><div class="s">${subLine('spotify', 'Peak Time', 'yours', '24 tracks')}</div></span></div>
      <div class="row"><span class="cov" style="background:${cover('Example_Channel')}"></span><span class="lines"><div class="t">Example_Channel</div><div class="s">${subLine('youtubemusic', 'Example Warm-up', 'Example Channel', '7 tracks')}</div></span></div></div>
      ${linkGuide(true)}<div class="hint">Add more and change their order later in Playlists.</div>` : linkGuide();
    return `<div class="inner" style="border-left:0"><div class="colframe"><div class="content">${header('Set up Discjockey', '', '<span class="lnk" style="color:var(--muted)">Finish later</span>')}${strip}${card}${list}
      <div class="colfoot"><span class="btn">Back</span><span class="btn filled">Finish</span></div></div></div></div>`;
  }

  // ---- Library ----
  const TRK = [
    { n: 'Night Drive', a: 'Mira Volt', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Sternenstaub', a: 'Bassgewitter', q: '<span class="badge b-ok">20.0 kHz</span>' },
    { n: 'Druckwelle', a: 'Remo Rush', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Sunrise Tekk', a: 'Nachtfalter', q: '<span class="badge b-weak">16.0 kHz</span>' },
    { n: 'Funkenflug', a: 'Nachtfalter', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Wellenreiter', a: 'Kalte Nacht', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Kaltfront', a: 'Remo Rush', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Berlin 2019', a: 'Mira Nacht', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Durch die Halle', a: 'Low Ceiling', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Taktgefuehl', a: 'Low Ceiling', q: '<span class="badge b-weak">16.0 kHz</span>' },
    { n: 'Zeitlupe', a: 'Frau Funk', q: '<span class="badge" style="color:var(--lossy)">FAKE</span>' },
    { n: 'Lichtspiel', a: 'Tekk Tobi', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Nordlicht', a: 'Kalte Nacht', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'AEIOU', a: 'Pegassi', q: '<span class="q">Waiting</span>', wait: true },
    { n: 'Hands Up Again', a: 'Bassgewitter', q: '<span class="q">Waiting</span>', wait: true },
    { n: 'Nebelmaschine', a: 'Low Ceiling', q: '<span class="q">Waiting</span>', wait: true },
    { n: 'Rush Hour', a: 'Pulsar 9', q: '<span class="q">Waiting</span>', wait: true },
    { n: 'Kettenreaktion', a: 'Remo Rush', q: '<span class="q">Waiting</span>', wait: true },
  ];
  const UPL = [
    { n: 'Lumen', a: 'Kiro Vale', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Tidal Lines', a: 'Kiro Vale', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Low Orbit', a: 'Ana Feld', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Glasshouse', a: 'Ana Feld', q: '<span class="badge b-good">LOSSLESS</span>' },
    { n: 'Hollow Pier', a: 'Sete', q: '<span class="q">Waiting</span>', wait: true },
  ];
  const INS = '<svg width="16" height="13" viewBox="0 0 16 13"><rect x=".75" y=".75" width="14.5" height="11.5" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.4 1v11" stroke="currentColor" stroke-width="1.3"/></svg>';
  function libraryPage(kind) {
    const up = kind === 'library-upload', open = kind !== 'library-none';
    const pl = up ? ['Example_Label', 'soundcloud'] : ['Hard_Bounce', 'spotify'];
    const rows = up ? UPL : TRK;
    const showBrowser = !open || W >= 1240;
    const strip = up
      ? { pct: 100, cap: '4 of 4 checked · 4 of 5 downloaded', q: [['good', 4], ['wait', 1]], r: [0, 0] }
      : { pct: 69, cap: '9 of 13 checked · 13 of 18 downloaded', q: [['good', 9], ['ok', 1], ['weak', 2], ['lossy', 1], ['wait', 5]], r: [1, 4] };
    const main = `${header(pl[0], `${SVC_NAME[pl[1]]} playlist`, `<div class="search" style="width:220px"><span>⌕</span>Search title, artist…<span class="cap">⌘F</span></div><span class="ib ${open ? 'on' : ''}">${INS}</span>`)}
      <div class="sl strip"><div class="l"><div class="big"><b>${strip.pct}</b><span class="u">% lossless</span>${qbar(strip.q, 5)}</div><div class="cap2">${strip.cap}</div></div>
        <div class="r"><div><span class="d" style="width:7px;height:7px;border-radius:50%;background:var(--good)"></span>Upgrade ready<span class="c">${strip.r[0]}</span><span class="chev">›</span></div>
        <div><span style="width:10px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ok),var(--weak),var(--lossy))"></span>Not lossless yet<span class="c">${strip.r[1]}</span><span class="chev">›</span></div></div></div>
      <div class="seg"><span class="on">All <span class="c">${rows.length}</span></span><span><i class="d" style="background:var(--good)"></i>Lossless <span class="c">${up ? 4 : 9}</span></span><span>Good lossy <span class="c">${up ? 0 : 1}</span></span><span>Weak <span class="c">${up ? 0 : 2}</span></span><span>Upgrade ready <span class="c">${up ? 0 : 1}</span></span></div>
      <div class="sl grow tbl"><div class="th"><span class="c1">#</span><span class="c2">Track</span><span class="c3">Artist</span><span class="c4">Quality</span></div>
        ${rows.map((t, i) => `<div class="tr ${open && i === 0 ? 'sel' : ''}"><span class="c1">${i + 1}</span><span class="c2"><span class="cov ${t.wait ? 'dash' : ''}" style="${t.wait ? '' : `background:${cover(t.n)}`}"></span><span class="nm">${t.n}</span></span><span class="c3">${t.a}</span><span class="c4">${t.q}</span></div>`).join('')}</div>`;
    const t = rows[0];
    const src = up
      ? `<div class="kv"><span class="k">Source</span><span class="v">SoundCloud · WAV<span class="l2">the playlist's own upload</span></span></div>`
      : `<div class="kv"><span class="k">Source</span><span class="v"><span class="lnk">Qobuz${EXT}</span> · FLAC<span class="l2">exact Qobuz track</span></span></div>`;
    const insp = `<div class="card"><div class="thead"><span class="cv" style="background:${cover(t.n)}"></span><div style="min-width:0;flex:1"><div class="a">${t.n}</div><div class="b" title="${t.a} · ${up ? '5:40' : '6:12'} · in ${pl[0]}">${t.a} · ${up ? '5:40' : '6:12'} · in ${pl[0]}</div>
        <div class="st"><span class="badge b-good" title="verified lossless">LOSSLESS</span><span class="w">verified lossless</span></div></div></div>
        <div class="openin">${logo(pl[1])}<span class="lnk">Open in ${SVC_NAME[pl[1]]}${EXT}</span></div></div>
      <div class="card"><div class="chead"><span class="lab">Current file</span><span class="lnk">Show in Finder</span></div><div class="spec"></div>
        <div class="mp"><span class="pbtn">▶</span><span class="wave"></span><span class="tm">0:00 / ${up ? '5:40' : '6:12'}</span></div>
        <div class="kv"><span class="k">Format</span><span class="v">AIFF · 16-bit</span></div>${src}
        <div class="kv"><span class="k">Playlists</span><span class="v">${up ? 'Example_Label' : 'Hard_Bounce, Powertrance'}</span></div>
        <div class="kv"><span class="k">Added</span><span class="v">3 Nov 2026</span></div>
        <div class="kv"><span class="k">File</span><span class="v cut">${t.a} - ${t.n}.aiff</span></div></div>`;
    return `${sidebar('library', true, showBrowser)}${showBrowser ? browser(pl[0]) : ''}<div class="inner"><div class="listarea"><div class="content wide">${main}</div></div>${open ? `<div class="panel" style="width:${pw()}px">${insp}</div>` : ''}</div>`;
  }

  // ---- To-do ----
  function todoPage() {
    const row = (n, f, b, sel) => `<div class="row ${sel ? 'sel' : ''}"><span class="cov" style="background:${cover(n)}"></span><span class="lines"><div class="t n">${n}</div><div class="s"><span class="x">${f}</span></div></span>${b}</div>`;
    const sec = (n, c, h) => `<div class="slh" style="border-top:1px solid var(--row-line)"><span class="lab">${n}</span><span class="sum">${c}</span><span class="sum">${h}</span></div>`;
    const main = `${header('To-do', '18 tracks are not lossless yet', READ)}
      <div class="seg"><span class="on">All <span class="c">18</span></span><span>rekordbox <span class="c">1</span></span><span><i class="d" style="background:var(--good)"></i>Upgrades <span class="c">2</span></span><span><i class="d" style="background:var(--weak)"></i>Not found <span class="c">3</span></span><span>More ▾</span></div>
      <div class="sl grow"><div class="slh"><span class="lab">All to-dos</span></div>
        ${sec('Upgrade ready', '2', 'a better version is waiting for you')}
        ${row('Lio Sander - Get Lost', 'Hard_Bounce · Lossless ready · cues can stay', '<span class="badge b-weak">16.0 kHz</span><span class="badge b-good">UPGRADE</span>', true)}
        ${row('Mira Volt - Strobe Light', 'Powertrance · Lossless ready · different edit', '<span class="badge b-ok">20.0 kHz</span><span class="badge b-good">UPGRADE</span>')}
        ${sec('Not found', '3', 'nothing usable anywhere')}
        ${row('Some Artist - Gone Track', 'Hard_Bounce · next try in 5 days', '<span class="badge b-weak">NOT FOUND</span>')}
        ${row('Tekk Tobi - Hyperdrive', 'Tekke_Ecke · next try in 2 days', '<span class="badge b-weak">NOT FOUND</span>')}</div>`;
    const panel = `<div class="card"><div class="thead"><span class="cv" style="background:${cover('Lio Sander - Get Lost')}"></span><div style="min-width:0;flex:1"><div class="a">Get Lost</div><div class="b" title="Lio Sander · 4:28 · Hard_Bounce">Lio Sander · 4:28 · Hard_Bounce</div>
        <div class="st"><span class="badge b-weak" title="lossy, audible">16.0 kHz</span><span class="w">lossy, audible</span></div></div><span class="lnk hide">Hide</span></div>
        <div class="openin">${logo('spotify')}<span class="lnk">Open in Spotify${EXT}</span></div></div>
      <div class="card upc"><div><span class="lab">Upgrade ready</span> <span class="sum">found 5 Nov</span></div>
        <div class="two"><div><div class="mini"></div><div class="cp">NOW</div><div class="vv" title="Your AIFF was made from this">Opus · 135 kbps</div></div><div><div class="mini"></div><div class="cp">NEW</div><div class="vv">FLAC · lossless</div></div></div>
        <div class="mp" style="margin:12px 0 0"><span class="pbtn">▶</span><div class="seg" style="flex:1;height:30px"><span class="on">Now</span><span>New</span></div><span class="tm">0:00 / 4:28</span></div></div>
      <div class="sl"><div class="slh"><span class="lab">In rekordbox</span></div><div class="row"><span class="pbtn" style="width:16px;height:16px;box-shadow:inset 0 0 0 3px #000;background:var(--accent)"></span><span class="lines"><div class="t n">Same track <span style="color:var(--accent-text);letter-spacing:.7px;font-size:11px;margin-left:6px">RECOMMENDED</span></div><div class="s"><span style="color:var(--good)">✓</span>Your track keeps its cues</div></span></div>
        <div class="row"><span class="pbtn" style="width:16px;height:16px;border-color:var(--label)"></span><span class="lines"><div class="t n">New track</div><div class="s">Relocate your old track to keep cues</div></span></div></div>
      <div class="pfoot" style="flex-direction:column"><span class="btn filled" style="justify-content:center">Replace with lossless</span><span class="btn" style="justify-content:center">Discard the new version</span></div>`;
    return `${sidebar('todo')}<div class="inner"><div class="listarea"><div class="content">${main}</div></div><div class="panel" style="width:${pw()}px">${panel}</div></div>`;
  }

  // ---- Sync (running) ----
  function syncPage() {
    const res = (n, f, b) => `<div class="row"><span class="cov" style="background:${cover(n)}"></span><span class="lines"><div class="t n">${n}</div><div class="s"><span class="x">${f}</span></div></span>${b}</div>`;
    const main = `${header('Syncing', '4 of 12 · ~6 min left', '<span class="btn">Stop</span>')}
      <div class="card" style="padding:0"><div class="syncc"><span class="bigcv" style="background:${cover('Lumen')}"></span><div style="flex:1;min-width:0">
        <div class="kick">Now · Example_Label</div><div class="ttl">Kiro Vale - Lumen</div>
        <div class="from">${logo('soundcloud')}SoundCloud · the playlist's own upload</div>
        <div class="stepbar"><span class="d">Search</span><span class="c">Download</span><span>Convert</span><span>Check</span></div>
        <div class="hint" style="margin-top:10px;color:var(--text)">Downloading · <b>41 of 96 MB</b> · ~6 s left</div><div class="prog"><i style="width:43%"></i></div></div></div></div>
      <div class="seg"><span class="on">All <span class="c">3</span></span><span><i class="d" style="background:var(--good)"></i>Lossless <span class="c">2</span></span><span><i class="d" style="background:var(--ok)"></i>Lossy <span class="c">1</span></span><span>Problems <span class="c">0</span></span></div>
      <div class="sl grow"><div class="slh"><span class="lab">Done</span><span class="sum">3</span></div>
        ${res('Mira Volt - Night Drive', 'Hard_Bounce', '<span class="badge b-good">LOSSLESS</span>')}
        ${res('Remo Rush - Druckwelle', 'Hard_Bounce', '<span class="badge b-good">LOSSLESS</span>')}
        ${res('Nachtfalter - Sunrise Tekk', 'Hard_Bounce', '<span class="badge b-weak">16.0 kHz · YouTube Music</span>')}</div>`;
    return `${sidebar('sync')}<div class="inner"><div class="colframe"><div class="content">${main}</div></div></div>`;
  }

  // ---- states ----
  const STATES = [
    ['playlists', 'Playlists', 'Problems 1, 7, 10: the paste field with the four logos; rows carry the logo; the count sits in the list head', () => playlistsPage('list')],
    ['empty', 'Playlists empty', 'Problems 1, 2, 9: first open, no playlists: the panel says how a playlist comes in and where to find a link', () => playlistsPage('empty')],
    ['liked-off', 'Liked music off', 'Problem 3: a Liked music link pasted while the setting is off', () => playlistsPage('liked-off')],
    ['liked-on', 'Liked music on', 'Problem 3: the same link with the setting on', () => playlistsPage('liked-on')],
    ['settings', 'Settings off', 'Problem 3: Settings › YouTube Music, Liked music off (the default)', () => settingsPage(false)],
    ['settings-on', 'Settings on', 'Problem 3: Liked music on, offered as one click', () => settingsPage(true)],
    ['setup', 'Setup', 'Problems 1, 2: Setup\'s playlist step before the first playlist', () => setupPage(false)],
    ['setup-added', 'Setup added', 'Problem 7: Setup\'s rows read like the Playlists rows; the guide folds away', () => setupPage(true)],
    ['library', 'Library details', 'Problems 5, 6, 8: Open in Spotify; Format is the file, Source what it came from; the count in the strip', () => libraryPage('library')],
    ['library-upload', 'Own upload', 'Problems 4, 6: a track from the playlist\'s own upload', () => libraryPage('library-upload')],
    ['library-none', 'No selection', 'Problem 8: nothing picked, details closed', () => libraryPage('library-none')],
    ['todo', 'To-do upgrade', 'Problems 5, 6: the narrow upgrade card keeps Now and New; Open in Spotify in the head', () => todoPage()],
    ['sync', 'Sync', 'Problem 4: the running card says the track comes from the playlist\'s own upload', () => syncPage()],
  ];
  let state = 'playlists';
  const [h0, s0] = location.hash.slice(1).split('@');
  if (STATES.some((s) => s[0] === h0)) state = h0;
  if (SIZES[s0]) [W, H] = SIZES[s0];
  const stage = document.getElementById('stage');
  function render() {
    const st = STATES.find((s) => s[0] === state);
    stage.innerHTML = `<div class="sizer"><div class="win" style="width:${W}px;height:${H}px"><div class="body">${st[3]()}</div></div></div>`;
    const avail = [stage.clientWidth - 32, stage.clientHeight - 16];
    const k = Math.min(1, avail[0] / W, avail[1] / H);
    const sizer = stage.querySelector('.sizer'); sizer.style.width = `${W * k}px`; sizer.style.height = `${H * k}px`;
    stage.querySelector('.win').style.transform = `scale(${k})`;
    document.querySelectorAll('#state button').forEach((b) => b.classList.toggle('on', b.dataset.k === state));
    document.querySelectorAll('#size button').forEach((b) => b.classList.toggle('on', Number(b.dataset.w) === W));
    history.replaceState(null, '', `#${state}@${W}`);
  }
  document.getElementById('state').innerHTML = STATES.map(([k, n, tip]) => `<button data-k="${k}" title="${esc(tip)}">${n}</button>`).join('');
  document.getElementById('size').innerHTML = Object.keys(SIZES).map((w) => `<button data-w="${w}">${w}</button>`).join('');
  document.getElementById('state').onclick = (e) => { const b = e.target.closest('button'); if (b) { state = b.dataset.k; render(); } };
  document.getElementById('size').onclick = (e) => { const b = e.target.closest('button'); if (b) { [W, H] = SIZES[b.dataset.w]; render(); } };
  addEventListener('resize', render);
  render();
})();
</script>
</body></html>
