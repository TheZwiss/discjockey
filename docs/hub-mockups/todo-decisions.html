<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do decisions</title>
<!-- Mockup: the To-do page's decision panels (Upgrade ready, the rekordbox check after it, Duplicates), before and
     after. Notes: todo-decisions-notes.md. Tokens copied from hub-ui/src/lib/styles/tokens.css (the app is dark only). -->
<style>
:root {
  --bg:#000; --bg-selected:#0d0d10; --bg-inset:#17171a;
  --text:#d9d9dc; --text-strong:#f2f2f4; --text-active:#ececee; --text-muted:#9a9aa0; --text-dim:#8c8c92;
  --text-nav:#7c7c84; --text-label:#7a7a80; --text-disabled:#45454b;
  --surface:linear-gradient(#0f0f12,#0a0a0c); --surface-list:linear-gradient(#0c0c0e,#08080a);
  --surface-line:rgba(255,255,255,.07); --surface-highlight:inset 0 1px 0 rgba(255,255,255,.04);
  --sidebar-bg:linear-gradient(#0b0b0d,#070708); --line-soft:rgba(255,255,255,.045);
  --ctl-line:rgba(255,255,255,.09); --ctl-bg:rgba(255,255,255,.03); --ctl-hover:rgba(255,255,255,.035); --ctl-press:rgba(255,255,255,.06);
  --go-bg:linear-gradient(#ff6a30,#f2521a); --go-highlight:inset 0 1px 0 rgba(255,255,255,.25); --go-glow:0 4px 14px rgba(255,90,31,.22);
  --accent:#ff5a1f; --accent-text:#ff8a5a; --accent-line:rgba(255,90,31,.5); --accent-wash:rgba(255,90,31,.07); --accent-wash-strong:rgba(255,90,31,.14);
  --text-on-accent:#000;
  --q-lossless:#2fd27a; --q-lossless-line:rgba(47,210,122,.45);
  --q-good:#e8b93a; --q-good-line:rgba(232,185,58,.45);
  --q-weak:#ff6b6b; --q-weak-line:rgba(255,107,107,.45);
  --q-other:#9a9aa0; --q-other-line:rgba(154,154,160,.4);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --fs-label:11px; --fs-small:12px; --fs-body:13px; --fs-title:17px; --fs-h1:22px;
  --r-surface:12px; --r-ctl:8px; --r-go:10px; --r-badge:4px; --r-cover:4px; --r-art:8px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px;
  --h-ctl-sm:26px; --h-btn:34px; --activity-h:44px; --dim-locked:.5;
  --ease:cubic-bezier(.22,1,.36,1); --t-press:100ms; --t-state:240ms; --t-hover:120ms;
}
* { box-sizing:border-box; }
html, body { margin:0; background:#050506; color:var(--text); font-family:var(--font); font-size:var(--fs-body);
  -webkit-font-smoothing:antialiased; }

/* ---------- the switcher (mockup only) ---------- */
.bar { display:flex; flex-wrap:wrap; gap:var(--s-2) var(--s-4); align-items:center; padding:var(--s-3) var(--s-4);
  border-bottom:1px solid var(--surface-line); position:sticky; top:0; background:#050506; z-index:5; }
.seg { display:inline-flex; border:1px solid var(--ctl-line); border-radius:var(--r-ctl); overflow:hidden; background:var(--ctl-bg); }
.seg button { font:inherit; font-size:var(--fs-small); color:var(--text-muted); background:none; border:0; padding:5px 10px;
  border-right:1px solid var(--ctl-line); cursor:pointer; white-space:nowrap; }
.seg button:last-child { border-right:0; }
.seg button[aria-pressed=true] { background:var(--accent-wash-strong); color:var(--accent-text); }
.bar .cap { font-size:var(--fs-label); text-transform:uppercase; letter-spacing:.7px; color:var(--text-label); }
.bar .grp { display:flex; align-items:center; gap:var(--s-2); }
.stage { padding:var(--s-5) var(--s-4) 40px; display:flex; justify-content:center; }

/* ---------- the window ---------- */
.win { position:relative; height:700px; background:var(--bg); border-radius:10px; overflow:hidden;
  box-shadow:0 0 0 1px #1a1a1d, 0 20px 60px rgba(0,0,0,.6); display:grid;
  grid-template-columns:168px 1fr var(--pw); grid-template-rows:1fr var(--activity-h); flex-shrink:0; }
.chrome { grid-column:1; grid-row:1 / 3; background:var(--sidebar-bg); }
.foot { grid-column:1 / 4; grid-row:2; background:var(--sidebar-bg); position:relative; z-index:1;
  display:flex; align-items:center; gap:var(--s-3); padding:0 var(--s-4) 0 calc(168px + var(--s-4));
  border-top:1px solid var(--surface-line); margin-left:168px; padding-left:var(--s-4); }
.side { grid-column:1; grid-row:1; padding:14px 10px; display:flex; flex-direction:column; gap:2px; position:relative; z-index:1;
  border-right:1px solid var(--surface-line); }
.brand { display:flex; align-items:center; gap:9px; color:var(--text-dim); font-weight:700; padding:4px 8px 14px; }
.brand svg { width:16px; height:16px; flex-shrink:0; }
.nav { display:flex; align-items:center; gap:9px; height:30px; padding:0 8px; border-radius:7px; color:var(--text-nav); }
.nav svg { width:14px; height:14px; flex-shrink:0; }
.nav.on { background:rgba(255,255,255,.06); color:var(--text-active); }
.nav .n { margin-left:auto; font-size:var(--fs-small); color:var(--text-label); font-variant-numeric:tabular-nums; }
.side .grow { flex:1; }
.main { grid-column:2; grid-row:1; padding:18px 20px 16px; display:flex; flex-direction:column; gap:var(--s-3); min-width:0; overflow:hidden; }
.ph { display:flex; align-items:baseline; gap:var(--s-3); min-height:34px; }
.ph h1 { margin:0; font-size:var(--fs-h1); color:var(--text-strong); font-weight:700; }
.ph .sub { font-size:var(--fs-small); color:var(--text-muted); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ph .read { font-size:var(--fs-small); color:var(--text-muted); white-space:nowrap; }
.filt { display:flex; border:1px solid var(--ctl-line); border-radius:var(--r-ctl); background:var(--ctl-bg); height:30px; }
.filt span { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; font-size:var(--fs-small); color:var(--text-muted);
  border-right:1px solid var(--ctl-line); white-space:nowrap; }
.filt span:last-child { border-right:0; }
.filt span.on { background:var(--accent-wash-strong); color:var(--accent-text); }
.filt i { width:6px; height:6px; border-radius:50%; display:inline-block; }
.list { background:var(--surface-list); border:1px solid var(--surface-line); border-radius:var(--r-surface); overflow:hidden; box-shadow:var(--surface-highlight); }
.sec { display:flex; align-items:baseline; gap:var(--s-2); height:32px; padding:0 14px; font-size:var(--fs-small); color:var(--text-muted);
  border-bottom:1px solid var(--line-soft); align-items:center; }
.sec b { color:var(--text); font-weight:600; font-size:var(--fs-body); }
.row { display:flex; align-items:center; gap:var(--s-3); height:52px; padding:0 14px; border-bottom:1px solid var(--line-soft); }
.row.sel { background:rgba(255,255,255,.05); }
.row .cv { width:26px; height:26px; border-radius:var(--r-cover); flex-shrink:0; }
.row .tx { flex:1; min-width:0; }
.row .t1 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .t2 { font-size:var(--fs-small); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge { font-size:var(--fs-label); font-weight:700; letter-spacing:.7px; padding:2px 6px; border-radius:var(--r-badge); white-space:nowrap;
  border:1px solid; text-transform:uppercase; line-height:14px; flex-shrink:0; }
.b-l { color:var(--q-lossless); border-color:var(--q-lossless-line); }
.b-y { color:var(--q-good); border-color:var(--q-good-line); }
.b-r { color:var(--q-weak); border-color:var(--q-weak-line); }
.b-g { color:var(--q-other); border-color:var(--q-other-line); }
.b-a { color:var(--accent-text); border-color:var(--accent-line); }

/* ---------- the panel (Panel: head scrolls, foot stays) ---------- */
.panel { grid-column:3; grid-row:1; border-left:1px solid var(--surface-line); display:flex; flex-direction:column; min-height:0; }
.pbody { flex:1; min-height:0; overflow-y:auto; padding:20px 20px 12px; display:flex; flex-direction:column; gap:var(--s-3);
  scrollbar-width:none; }
.pbody::-webkit-scrollbar { display:none; }
.pbody > * { flex-shrink:0; }
.pfoot { padding:12px 20px 16px; display:flex; flex-direction:column; gap:var(--s-2); }
.card { background:var(--surface); border:1px solid var(--surface-line); border-radius:var(--r-surface); box-shadow:var(--surface-highlight);
  padding:14px; display:flex; flex-direction:column; gap:var(--s-3); min-width:0; }
.card.good { border-color:var(--q-lossless-line); }
.card.warn { border-color:var(--q-good-line); }
.card.flush { padding:0; gap:0; overflow:hidden; }
.chead { display:flex; align-items:baseline; gap:var(--s-2); min-width:0; }
.chead .lbl { font-weight:600; color:var(--text); white-space:nowrap; }
.chead .sum { font-size:var(--fs-small); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.chead .act { margin-left:auto; font-size:var(--fs-small); color:var(--accent-text); font-weight:600; white-space:nowrap; }
.flush .chead { padding:12px 14px 10px; }
.th { display:flex; gap:var(--s-3); align-items:center; min-width:0; }
.th .art { width:58px; height:58px; border-radius:var(--r-art); flex-shrink:0; }
.th .tt { min-width:0; flex:1; display:flex; flex-direction:column; gap:2px; }
.th .t { font-size:var(--fs-title); font-weight:600; color:var(--text-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:var(--s-2); align-items:baseline; }
.th .t span:first-child { overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
.th .t .hide { font-size:var(--fs-small); color:var(--text-muted); font-weight:600; }
.th .m { font-size:var(--fs-small); color:var(--text-muted); }
.caps { font-size:var(--fs-label); text-transform:uppercase; letter-spacing:.7px; color:var(--text-label); }
.hint { font-size:var(--fs-small); color:var(--text-muted); margin:0; }
.hint.c { text-align:center; }
.spec { height:36px; border-radius:6px; border:1px solid #1c1c20; position:relative; overflow:hidden;
  background:linear-gradient(to top,#000 0%,#2a0d4d 12%,#7b2cff 38%,#ff5a1f 70%,#ffd36b 92%); }
.spec.cut::after { content:""; position:absolute; left:0; right:0; top:0; height:30%; background:#000; border-bottom:1px dashed rgba(255,255,255,.55); }
.specs { display:grid; grid-template-columns:1fr 1fr; gap:var(--s-2); }
.specs > div { display:flex; flex-direction:column; gap:var(--s-1); min-width:0; position:relative; }
.specs .on-spec { position:absolute; left:6px; top:3px; z-index:1; font-size:var(--fs-label); text-transform:uppercase; letter-spacing:.7px; color:var(--text); text-shadow:0 1px 2px #000; }
.specs .fmt { font-size:var(--fs-small); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kv { display:grid; grid-template-columns:62px 1fr; align-items:baseline; gap:var(--s-2); font-size:var(--fs-small); }
.kv .v { color:var(--text); display:flex; align-items:center; gap:6px; min-width:0; }
.dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; display:inline-block; }
.d-l { background:var(--q-lossless); } .d-y { background:var(--q-good); } .d-g { background:var(--q-other); } .d-r { background:var(--q-weak); }
.ab { display:flex; align-items:center; gap:var(--s-2); }
.play { width:var(--h-ctl-sm); height:var(--h-ctl-sm); border-radius:50%; border:1.5px solid var(--accent); display:grid; place-items:center; flex-shrink:0; }
.play svg { width:9px; height:9px; fill:var(--accent-text); margin-left:1px; }
.ab .seg { flex:1; }
.ab .seg button { flex:1; padding:4px 0; }
.ab .t { font-size:var(--fs-small); color:var(--text-label); font-variant-numeric:tabular-nums; }
.rule { border-top:1px solid var(--line-soft); margin:0 -14px; }

/* choice rows (proposed block ChoiceGroup: one of a few, each with what it does) */
.ch { display:flex; gap:10px; padding:11px 14px; border-top:1px solid var(--line-soft); cursor:pointer; align-items:flex-start;
  transition:background var(--t-hover) ease; }
.ch:hover { background:var(--ctl-hover); }
.ch:active { background:var(--ctl-press); }
.ch.on { background:var(--accent-wash); }
.ch.off { cursor:default; }
.ch.off:hover { background:none; }
.ch.off .rb, .ch.off .nm { opacity:var(--dim-locked); }
.rb { width:16px; height:16px; border-radius:50%; border:1.5px solid rgba(255,255,255,.22); flex-shrink:0; margin-top:1px; position:relative;
  transition:border-color var(--t-hover) ease; }
.ch.on .rb { border-color:var(--accent); }
.ch.on .rb::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
.cx { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.nm { display:flex; align-items:baseline; gap:var(--s-2); color:var(--text); font-weight:500; min-width:0; }
.nm .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.rec { margin-left:auto; font-size:var(--fs-label); text-transform:uppercase; letter-spacing:.7px; color:var(--accent-text); font-weight:600; white-space:nowrap; }
.why { font-size:var(--fs-small); color:var(--text-muted); }
.why.lock { color:var(--text-label); }
.oc { display:flex; flex-direction:column; gap:3px; margin-top:3px; }
.o { display:grid; grid-template-columns:14px 1fr; gap:6px; font-size:var(--fs-small); color:var(--text); align-items:start; line-height:16px; }
.o svg { width:12px; height:12px; margin-top:2px; }
.o.g svg { color:var(--q-lossless); } .o.y svg { color:var(--q-good); } .o.r svg { color:var(--q-weak); } .o.n svg { color:var(--text-label); }
.o.n { color:var(--text-muted); }
.ch .play { margin-left:auto; align-self:center; }
.fmtline { display:flex; align-items:center; gap:6px; min-width:0; }
.fmtline .f { color:var(--text); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.where { font-size:var(--fs-small); color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gone { font-size:var(--fs-small); color:var(--q-good); display:flex; gap:5px; align-items:center; }
.gone svg { width:12px; height:12px; }
.reason { font-size:var(--fs-small); color:var(--accent-text); }

/* steps after the change */
.steps { display:flex; flex-direction:column; gap:var(--s-2); margin:0; padding:0; list-style:none; }
.steps li { display:grid; grid-template-columns:20px 1fr; gap:var(--s-2); font-size:var(--fs-small); color:var(--text); line-height:17px; }
.steps .k { width:18px; height:18px; border-radius:50%; border:1px solid var(--q-good-line); color:var(--q-good); font-size:var(--fs-label);
  display:grid; place-items:center; font-weight:700; font-variant-numeric:tabular-nums; }
.steps .s { color:var(--text-muted); }
.changes { display:flex; flex-direction:column; }
.chg { display:grid; grid-template-columns:20px 1fr auto; gap:var(--s-2); align-items:center; padding:7px 0; border-top:1px solid var(--line-soft); font-size:var(--fs-small); }
.chg:first-child { border-top:0; padding-top:0; }
.chg svg { width:14px; height:14px; color:var(--text-label); }
.chg .p { min-width:0; display:flex; flex-direction:column; }
.chg .p b { font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chg .p span { color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* buttons */
.btn { font:inherit; font-weight:600; height:var(--h-btn); border-radius:var(--r-ctl); border:1px solid var(--ctl-line); background:var(--ctl-bg);
  color:var(--text); padding:0 14px; display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; white-space:nowrap;
  transition:transform var(--t-press) ease-out, background var(--t-hover) ease; }
.btn:active { transform:scale(.97); }
.btn svg { width:14px; height:14px; }
.btn.go { background:var(--go-bg); box-shadow:var(--go-highlight),var(--go-glow); border:0; border-radius:var(--r-go); color:var(--text-on-accent); }
.btn.go[disabled] { background:var(--bg-inset); box-shadow:none; color:var(--text-label); cursor:default; transform:none; }
.btn.wide { width:100%; }
.btn.link { border:0; background:none; height:auto; padding:0; color:var(--accent-text); font-size:var(--fs-small); }
.btn.link.muted { color:var(--text-muted); }
.actions { display:flex; gap:var(--s-4); align-items:center; }
.cue { display:flex; align-items:center; gap:var(--s-2); padding-top:var(--s-3); border-top:1px solid var(--line-soft); font-size:var(--fs-small); }
.note { display:grid; grid-template-columns:16px 1fr; gap:var(--s-2); font-size:var(--fs-small); color:var(--text-muted); }
.note.warn { color:var(--text); }
.fileh { display:flex; flex-direction:column; gap:2px; }
.fileh .r1 { display:flex; justify-content:space-between; gap:var(--s-2); }
.empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--s-2); text-align:center; padding:0 var(--s-5); }
.empty svg { width:28px; height:28px; color:var(--text-label); }
.empty b { color:var(--text); font-weight:600; }
/* foot player (unchanged) */
.foot .cvs { width:28px; height:28px; border-radius:var(--r-cover); background:linear-gradient(135deg,#2fd27a,#1d6fff); flex-shrink:0; }
.foot .ft { min-width:0; width:200px; }
.foot .ft div:first-child { font-size:var(--fs-small); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.foot .ft div:last-child { font-size:var(--fs-label); color:var(--text-label); }
.foot .pp { width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.08); display:grid; place-items:center; }
.foot .pp svg { width:9px; height:9px; fill:var(--text); margin-left:1px; }
.foot .seek { flex:1; height:3px; background:var(--bg-inset); border-radius:2px; position:relative; }
.foot .seek::before { content:""; position:absolute; left:0; top:0; bottom:0; width:34%; background:var(--accent); border-radius:2px; }
.foot .tm { font-size:var(--fs-small); color:var(--text-label); font-variant-numeric:tabular-nums; }
@media (prefers-reduced-motion: reduce) { .btn, .ch, .rb { transition:none; } }
</style>
</head>
<body>
<div class="bar">
  <div class="grp"><span class="cap">Version</span><div class="seg" id="ver"></div></div>
  <div class="grp"><span class="cap">Upgrade</span><div class="seg" id="st-up"></div></div>
  <div class="grp"><span class="cap">After the step</span><div class="seg" id="st-after"></div></div>
  <div class="grp"><span class="cap">Duplicates</span><div class="seg" id="st-dup"></div></div>
  <div class="grp"><span class="cap">Window</span><div class="seg" id="size"></div></div>
</div>
<div class="stage"><div class="win" id="win"></div></div>

<script>
// ---------- glyphs (14 px grid, stroke) ----------
const I = {
  check:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.3l2.2 2.2 4.8-5"/></svg>',
  warn:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="6" r="4.6"/><path d="M6 3.6v2.8M6 8.3v.1"/></svg>',
  x:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.3 3.3l5.4 5.4M8.7 3.3l-5.4 5.4"/></svg>',
  aside:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 3.5h3l1 1h5v5h-9z"/></svg>',
  arrow:'<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h7.5M6.8 3.2L9.6 6 6.8 8.8"/></svg>',
  undo:'<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3L2 5.5 4.5 8"/><path d="M2.3 5.5h6.2a3.2 3.2 0 010 6.4H6"/></svg>',
  play:'<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>',
  file:'<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3.5 1.5h4.5l2.5 2.5v8.5h-7z"/><path d="M8 1.5V4h2.5"/></svg>',

      <span class="rb"></span><div class="cx">
        <div class="fmtline"><span class="badge ${f.b}">${f.q}</span><span class="f">${f.f}</span></div>
        <div class="where" title="${f.name}">${f.where.split(' › ').pop()}${f.pl ? ' · in your playlists' : ''}</div>
        ${f.k === rec ? `<div class="reason">Recommended: ${s.three ? 'AIFF keeps tags' : 'best quality'}</div>` : ''}
        ${leaving ? `<div class="gone">${I.arrow}Goes to Superseded/</div>` : ''}
      </div><div class="play">${I.play}</div></div>`;
  }).join('');
  const all = `<div class="ch${sel === 'all' ? ' on' : ''}" data-opt="all" role="radio" aria-checked="${sel === 'all'}"><span class="rb"></span>
    <div class="cx"><div class="nm"><span class="n">Keep ${n > 2 ? 'all' : 'both'}</span></div><div class="why">${n > 2 ? 'All' : 'Both'} stay; this to-do goes away</div></div></div>`;
  const meta = s.id === 'dup-tie' ? 'Rave Kollektiv · 6:02' : 'Neon Riot · 3:49';
  const why = s.id === 'dup-tie' ? '2 files of the same song' : `The same audio in ${n} files`;
  const body = head({ title: s.id === 'dup-tie' ? 'Bis zum Morgen' : 'Neonfieber', cv: s.id === 'dup-tie' ? 'c' : 'b' }, meta, `<div class="m">${why}</div>`, false) +
    `<div class="card flush"><div class="chead"><span class="lbl">Which file stays?</span>${s.winner ? '' : '<span class="sum">no clear winner</span>'}</div>
      ${s.winner ? '' : '<p class="hint" style="padding:0 14px 10px;margin-top:-4px">Same quality and length. Keep the one in the folder rekordbox uses.</p>'}
      <div role="radiogroup">${rows}</div>
      <div style="border-top:1px solid var(--surface-line)">${all.replace('class="ch', 'style="border-top:0" class="ch')}</div></div>
`;
  const moving = sel && sel !== 'all' ? n - 1 : 0;
  const label = !sel ? 'Choose the file that stays' : sel === 'all' ? `Keep ${n > 2 ? 'all' : 'both'}` : `Move ${moving} file${moving > 1 ? 's' : ''} to Superseded`;
  const hint = sel && sel !== 'all' ? '<p class="hint c">Not deleted: kept in Superseded/</p>' : '';
  return [body, `<button class="btn go wide"${sel ? '' : ' disabled'}>${label}</button>${hint}`];
}
function afterEmpty() {
  return [`<div class="empty">${I.done}<b>Nothing to decide</b><p class="hint">When a better version arrives or two of your files are the same song, you choose here.</p></div>`, ''];
}

// ---------- draw ----------
function draw() {
  bar();
  const s = STATES.find((x) => x.id === cur);
  const win = document.getElementById('win');
  win.style.width = W + 'px';
  win.style.height = (W === 1100 ? 700 : 800) + 'px';
  win.style.setProperty('--pw', (W < 1240 ? 320 : 360) + 'px');
  let p;
  if (s.empty) p = afterEmpty();
  else if (ver === 'before') p = s.grp === 'up' ? beforeUpgrade(s) : s.grp === 'after' ? beforeAfter(s) : beforeDup(s);
  else p = s.grp === 'up' ? afterUpgrade(s) : s.grp === 'after' ? afterStep(s) : afterDup(s);
  win.innerHTML = `<div class="chrome"></div>${sidebar(20)}<div class="main">${listArea(s)}</div>
    <div class="panel"><div class="pbody">${p[0]}</div>${p[1] ? `<div class="pfoot">${p[1]}</div>` : ''}</div>${footBar()}`;
  win.querySelectorAll('[data-opt]').forEach((el) => {
    if (!el.dataset.opt) return;
    el.onclick = () => { choice[s.id] = el.dataset.opt; draw(); };
  });
  const go = win.querySelector('[data-go]');
  if (go) go.onclick = () => {
    const k = go.dataset.go;
    if (k === 'swap') cur = 'swapped';
    else if (k === 'add') cur = s.match === 'different' || s.match === 'unknown' ? 'added-diff' : 'added';
    else return;
    draw();
  };
  history.replaceState(null, '', `#${cur}/${ver}/${W}`);
}
const h = location.hash.slice(1).split('/');
if (STATES.some((x) => x.id === h[0])) cur = h[0];
if (h[1] === 'before' || h[1] === 'after') ver = h[1];
if (h[2] === '1280') W = 1280;
draw();
</script>
</body>
</html>
