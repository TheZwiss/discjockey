[project]
name = "discjockey"
version = "1.2.1"
description = "Keep a lossless DJ library in sync with Spotify, Qobuz, SoundCloud and YouTube Music playlists"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "streamrip>=2.1.0,<3",
    "yt-dlp[default]>=2026.8.19",
    "mutagen>=1.47",
    "numpy>=2.0",
    "requests>=2.31",
    "pywebview>=6.2.1,<7",
    "sqlcipher3-wheels==0.5.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
]
build = ["pyinstaller==6.22.3", "dmgbuild>=1.6,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Parallel by default (pytest-xdist): the full suite drops from many minutes to about 25 s.
addopts = ["-n", "auto"]
markers = [
    "real_tools: the test runs every ffprobe and ffmpeg for real (tests/tool_memo.py answers a repeat on the same bytes otherwise)",
    "real_lock_waits: the test runs with the production lock waits (2 s), not the short ones tests/speed_locks.py sets",
    "real_sqlcipher_kdf: the test uses SQLCipher's own passphrase key derivation (tests/speed_sqlcipher.py derives it once per key otherwise)",
]
